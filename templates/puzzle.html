<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🎁 Собери пазл</title>
    <style>
        * {
            user-select: none;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Segoe UI', 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            height: 100vh;
            background: #0a0c12;
            touch-action: none;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.2s ease;
            background-image: url('/static/opening.jpg');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
        }
        
        .overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: -1;
        }
        
        .invite-text {
            font-size: 1.3rem;
            text-align: center;
            max-width: 600px;
            margin: 20px;
            margin-bottom: 40px;
            color: #ecd9b4;
            text-shadow: 0 2px 8px black;
            background: rgba(0, 0, 0, 0.55);
            padding: 18px 32px;
            border-radius: 80px;
            backdrop-filter: blur(8px);
            border: 1px solid #b88b4b;
            font-style: italic;
        }
        
        .compass-btn {
            background: none;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            filter: drop-shadow(0 0 8px #c9a458);
        }
        
        .compass-btn svg {
            width: 135px;
            height: 135px;
            transition: 0.2s;
        }
        
        .compass-btn:hover svg {
            transform: rotate(15deg) scale(1.05);
            filter: drop-shadow(0 0 15px #f3c26b);
        }
        
        .compass-btn:active svg {
            transform: scale(0.96);
        }
        
        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0b100e;
        }
        
        .puzzle-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out;
            cursor: grab;
        }
        
        .puzzle-wrapper:active {
            cursor: grabbing;
        }
        
        canvas {
            display: block;
            box-shadow: 0 0 0 3px #7a5a3a, 0 20px 40px black;
            border-radius: 20px;
            background: #1e2a1f;
            cursor: grab;
        }
        
        canvas:active {
            cursor: grabbing;
        }
        
        .progress-bar-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 30px;
            padding: 6px;
            backdrop-filter: blur(8px);
            border: 1px solid #dba551;
            z-index: 45;
        }
        
        .progress-bar {
            height: 14px;
            background: linear-gradient(90deg, #e6b85e, #f5d48a);
            border-radius: 30px;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 8px #ffd27a;
        }
        
        .progress-text {
            position: fixed;
            bottom: 50px;
            left: 20px;
            color: #ffefcf;
            font-size: 0.8rem;
            text-shadow: 0 1px 2px black;
            z-index: 45;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }
        
        .control-btn {
            background: #1f1a10cc;
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 10px 20px;
            border: 1px solid #e2b870;
            cursor: pointer;
            color: #ffefcf;
            font-weight: bold;
            font-size: 1rem;
        }
        
        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 130px;
            background: #1f1a10cc;
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 0.9rem;
            z-index: 50;
            border: 1px solid #e2b870;
            cursor: pointer;
            color: #ffefcf;
            font-weight: bold;
        }
        
        .win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease;
        }
        
        .win-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .win-video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            filter: brightness(0.4) sepia(0.2);
        }
        
        .win-content {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 70px;
            padding: 35px 50px;
            text-align: center;
            border: 2px solid #e8c28e;
            box-shadow: 0 0 70px rgba(210, 160, 70, 0.4);
            animation: flashWin 0.6s ease-out;
            max-width: 650px;
            margin: 20px;
        }
        
        @keyframes flashWin {
            0% { transform: scale(0.7); opacity: 0; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .win-content h2 {
            font-size: 2.5rem;
            color: #FFF5E0;
            text-shadow: 0 3px 8px black;
            margin-bottom: 20px;
        }
        
        .win-content p {
            font-size: 1.3rem;
            color: #FFF5E0;
            margin: 12px 0;
        }
        
        .ticket-info {
            background: #0a0705aa;
            border-radius: 40px;
            padding: 18px 20px;
            margin: 20px 0;
            font-size: 1.15rem;
            border: 1px solid #e8bc7a;
            color: #FFF2D7;
            line-height: 1.7;
        }
        
        .win-content button {
            background: #6a3e1a;
            border: none;
            padding: 14px 32px;
            font-size: 1.2rem;
            border-radius: 50px;
            color: #FFF2D7;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            font-weight: bold;
            border: 1px solid #e8bc7a;
        }
        
        .win-content button:hover {
            background: #9b5e2c;
            transform: scale(1.02);
        }
        
        .violin-icon {
            font-size: 3rem;
            filter: drop-shadow(0 0 6px gold);
            margin-bottom: 8px;
        }
        
        .hidden {
            display: none !important;
        }
        
        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            z-index: 300;
        }
        
        @media (max-width: 768px) {
            .cursor-particle {
                display: none;
            }
            .controls {
                bottom: 80px;
            }
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay">
    <div class="invite-text">
        Дорогая, я знаю, как ты любишь пазлы,<br>
        поэтому я подготовил тебе задачку, чтобы получить свой подарок! 😜
    </div>
    <button class="compass-btn" id="startBtn">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" fill="#2c2416" stroke="#d4af5a" stroke-width="2"/>
            <circle cx="50" cy="50" r="38" fill="#1e1910" stroke="#b8924b" stroke-width="1.5"/>
            <polygon points="50,15 58,45 50,85 42,45" fill="#d6a447" opacity="0.9"/>
            <polygon points="50,15 42,45 50,85 58,45" fill="#a5722e" opacity="0.8"/>
            <circle cx="50" cy="45" r="8" fill="#ffde9e" stroke="#8b5a2b" stroke-width="1.5"/>
            <text x="50" y="32" text-anchor="middle" fill="#ecc87b" font-size="10" font-weight="bold">N</text>
            <text x="50" y="70" text-anchor="middle" fill="#ecc87b" font-size="8">S</text>
        </svg>
    </button>
</div>

<div id="game" class="hidden">
    <div class="game-container">
        <div class="puzzle-wrapper" id="puzzleWrapper">
            <canvas id="puzzleCanvas"></canvas>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">Собрано 0 / 0</div>
        <div class="controls">
            <button class="control-btn" id="zoomOutBtn">−</button>
            <button class="control-btn" id="zoomInBtn">+</button>
            <button class="control-btn" id="resetViewBtn">⊙</button>
        </div>
    </div>
</div>

<div id="winOverlay" class="win-overlay">
    <video id="winVideo" class="win-video-bg" autoplay loop muted playsinline>
        <source src="/static/background.mp4" type="video/mp4">
    </video>
    <div class="win-content">
        <div class="violin-icon">🎻</div>
        <h2>🎂 С днём рождения, любимая!</h2>
        <p>Ты собрала пазл — а вот и подарок:</p>
        <div class="ticket-info">
            🎁 Твой билет на концерт!<br>
            📅 С нетерпением жду этого вечера с тобой!
        </div>
        <button id="downloadTicketBtn">📎 Скачать билет</button>
    </div>
</div>

<button id="musicToggle" class="music-btn hidden">🔇 Выключить музыку</button>

<div id="loadingSpinner" class="loading-spinner hidden">Загрузка пазла... 🧩</div>

<script>
    const PUZZLE_ID = '{{ puzzle_id }}';
    
    (function(){
        let pieces = [];
        let selectedPiece = null;
        let dragOffsetX = 0, dragOffsetY = 0;
        
        let canvas = document.getElementById('puzzleCanvas');
        let ctx = canvas.getContext('2d');
        
        let gameStarted = false;
        let winShown = false;
        
        let scale = 1;
        let panX = 0, panY = 0;
        let wrapper = document.getElementById('puzzleWrapper');
        let isDraggingWrapper = false;
        let wrapperDragStart = {x:0, y:0};
        
        let audio = new Audio("/static/music.mp3");
        audio.loop = true;
        audio.volume = 0.35;
        
        const overlay = document.getElementById('overlay');
        const gameDiv = document.getElementById('game');
        const winOverlay = document.getElementById('winOverlay');
        const startBtn = document.getElementById('startBtn');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const musicToggle = document.getElementById('musicToggle');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const resetViewBtn = document.getElementById('resetViewBtn');
        let audioEnabled = true;
        
        // Глобальный масштаб для кусочков
        let globalScale = 1;
        
        function updateProgress() {
            const fixedCount = pieces.filter(p => p.fixed === true).length;
            const total = pieces.length;
            const percent = (fixedCount / total) * 100;
            if(progressBar) progressBar.style.width = `${percent}%`;
            if(progressText) progressText.innerHTML = `Собрано ${fixedCount} / ${total}`;
            checkWin();
        }
        
        function animateSnap(piece, targetX, targetY, callback) {
            const startX = piece.x;
            const startY = piece.y;
            const duration = 150;
            const startTime = performance.now();
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(1, elapsed / duration);
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                piece.x = startX + (targetX - startX) * easeProgress;
                piece.y = startY + (targetY - startY) * easeProgress;
                draw();
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    piece.x = targetX;
                    piece.y = targetY;
                    if (callback) callback();
                    draw();
                    updateProgress();
                }
            }
            requestAnimationFrame(animate);
        }
        
        function trySnapToCorrect(piece){
            const snapDistance = 50;
            if(piece.fixed) return false;
            
            const group = piece.group || [piece];
            
            // Проверяем, близко ли вся группа к своим правильным позициям
            let allNearCorrect = true;
            let avgOffsetX = 0, avgOffsetY = 0;
            
            group.forEach(p => {
                const dx = p.x - p.correctX;
                const dy = p.y - p.correctY;
                avgOffsetX += dx;
                avgOffsetY += dy;
                if(Math.hypot(dx, dy) >= snapDistance) allNearCorrect = false;
            });
            
            avgOffsetX /= group.length;
            avgOffsetY /= group.length;
            
            if(allNearCorrect || (Math.abs(avgOffsetX) < snapDistance && Math.abs(avgOffsetY) < snapDistance)){
                let completed = 0;
                group.forEach(p => {
                    animateSnap(p, p.correctX, p.correctY, () => {
                        completed++;
                        if(completed === group.length) {
                            group.forEach(piece => { piece.fixed = true; });
                            updateProgress();
                            draw();
                        }
                    });
                });
                return true;
            }
            return false;
        }
        
        function trySnapPieces(pieceA, pieceB) {
            if(pieceA.group === pieceB.group) return false;
            if(pieceA.fixed || pieceB.fixed) return false;
            
            // Проверяем, должны ли эти кусочки соприкасаться
            const dx = (pieceA.x + pieceA.w/2) - (pieceB.x + pieceB.w/2);
            const dy = (pieceA.y + pieceA.h/2) - (pieceB.y + pieceB.h/2);
            const correctDx = (pieceA.correctX + pieceA.w/2) - (pieceB.correctX + pieceB.w/2);
            const correctDy = (pieceA.correctY + pieceA.h/2) - (pieceB.correctY + pieceB.h/2);
            
            const tolerance = 60;
            
            if(Math.abs(dx - correctDx) < tolerance && Math.abs(dy - correctDy) < tolerance) {
                // Объединяем группы
                const groupA = pieceA.group || [pieceA];
                const groupB = pieceB.group || [pieceB];
                const merged = [...new Set([...groupA, ...groupB])];
                
                // Выравниваем всю группу
                const rootPiece = merged[0];
                const rootCorrectX = rootPiece.correctX;
                const rootCorrectY = rootPiece.correctY;
                
                merged.forEach(p => {
                    p.x = p.correctX + (rootPiece.x - rootCorrectX);
                    p.y = p.correctY + (rootPiece.y - rootCorrectY);
                    p.group = merged;
                });
                
                draw();
                updateProgress();
                return true;
            }
            return false;
        }
        
        async function loadPiecesInfo() {
            const response = await fetch(`/pieces-info/${PUZZLE_ID}`);
            if (!response.ok) throw new Error('Не удалось загрузить информацию о пазле');
            return await response.json();
        }
        
        function loadPieceImage(pieceId) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = `/piece/${PUZZLE_ID}/${pieceId}`;
            });
        }
        
        // Функция для разбрасывания кусочков
        function getRandomPositionOutside(w, h, existingPieces, canvasW, canvasH, boardOffsetX, boardOffsetY, boardW, boardH) {
            const padding = 30;
            const positions = [];
            
            // Верхняя область
            for(let x = padding; x < canvasW - w - padding; x += w + 20) {
                for(let y = padding; y < boardOffsetY - h - padding; y += h + 20) {
                    positions.push({x, y});
                }
            }
            // Нижняя область
            for(let x = padding; x < canvasW - w - padding; x += w + 20) {
                for(let y = boardOffsetY + boardH + padding; y < canvasH - h - padding; y += h + 20) {
                    positions.push({x, y});
                }
            }
            // Левая область
            for(let y = boardOffsetY; y < boardOffsetY + boardH; y += h + 20) {
                for(let x = padding; x < boardOffsetX - w - padding; x += w + 20) {
                    positions.push({x, y});
                }
            }
            // Правая область
            for(let y = boardOffsetY; y < boardOffsetY + boardH; y += h + 20) {
                for(let x = boardOffsetX + boardW + padding; x < canvasW - w - padding; x += w + 20) {
                    positions.push({x, y});
                }
            }
            
            // Перемешиваем
            for(let i = positions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [positions[i], positions[j]] = [positions[j], positions[i]];
            }
            
            // Ищем свободное место
            for(let pos of positions) {
                let overlapping = false;
                for(let p of existingPieces) {
                    if(Math.abs(p.x - pos.x) < w + 20 && Math.abs(p.y - pos.y) < h + 20) {
                        overlapping = true;
                        break;
                    }
                }
                if(!overlapping) return pos;
            }
            
            // Если не нашли - кладём в угол
            return { x: padding, y: padding };
        }
        
        async function initPuzzle(){
            loadingSpinner.classList.remove('hidden');
            
            try {
                const piecesInfo = await loadPiecesInfo();
                console.log(`📦 Загружено ${piecesInfo.length} кусочков`);
                
                if(piecesInfo.length === 0) {
                    throw new Error('Нет данных о кусочках пазла');
                }
                
                // Загружаем все кусочки
                const loadedPieces = [];
                for(let i = 0; i < piecesInfo.length; i++) {
                    const info = piecesInfo[i];
                    const img = await loadPieceImage(info.id);
                    loadedPieces.push({
                        id: info.id,
                        img: img,
                        originalCorrectX: info.correct_x,
                        originalCorrectY: info.correct_y,
                        originalW: info.width,
                        originalH: info.height,
                        correctX: 0,
                        correctY: 0,
                        x: 0, y: 0,
                        w: 0, h: 0,
                        fixed: false,
                        group: null
                    });
                }
                
                // Находим границы оригинального пазла
                let minX = Infinity, minY = Infinity;
                let maxX = -Infinity, maxY = -Infinity;
                loadedPieces.forEach(p => {
                    minX = Math.min(minX, p.originalCorrectX);
                    minY = Math.min(minY, p.originalCorrectY);
                    maxX = Math.max(maxX, p.originalCorrectX + p.originalW);
                    maxY = Math.max(maxY, p.originalCorrectY + p.originalH);
                });
                
                const originalPuzzleW = maxX - minX;
                const originalPuzzleH = maxY - minY;
                
                // Вычисляем масштаб (целевой размер пазла ~70% экрана, кусочек ~120-150px)
                const targetScreenSize = Math.min(window.innerWidth, window.innerHeight) * 0.7;
                const targetPieceSize = 140;
                const originalPieceSize = loadedPieces[0].originalW;
                
                const scaleByScreen = targetScreenSize / Math.max(originalPuzzleW, originalPuzzleH);
                const scaleByPiece = targetPieceSize / originalPieceSize;
                globalScale = Math.min(scaleByScreen, scaleByPiece, 1.2);
                
                console.log(`📐 Масштаб: ${globalScale.toFixed(3)} (ориг. кусок ${originalPieceSize}px → ${Math.round(originalPieceSize * globalScale)}px)`);
                
                // Применяем масштаб ко всем кусочкам
                pieces = [];
                let boardMinX = Infinity, boardMinY = Infinity;
                let boardMaxX = -Infinity, boardMaxY = -Infinity;
                
                for(let p of loadedPieces) {
                    const scaledPiece = {
                        id: p.id,
                        img: p.img,
                        correctX: p.originalCorrectX * globalScale,
                        correctY: p.originalCorrectY * globalScale,
                        x: 0, y: 0,
                        w: p.originalW * globalScale,
                        h: p.originalH * globalScale,
                        fixed: false,
                        group: null
                    };
                    pieces.push(scaledPiece);
                    boardMinX = Math.min(boardMinX, scaledPiece.correctX);
                    boardMinY = Math.min(boardMinY, scaledPiece.correctY);
                    boardMaxX = Math.max(boardMaxX, scaledPiece.correctX + scaledPiece.w);
                    boardMaxY = Math.max(boardMaxY, scaledPiece.correctY + scaledPiece.h);
                }
                
                // Размеры доски (области сборки)
                const boardW = boardMaxX - boardMinX;
                const boardH = boardMaxY - boardMinY;
                
                // Настраиваем canvas (с отступами для разбросанных кусочков)
                const padding = Math.max(300, Math.min(500, boardW * 0.3));
                const canvasW = boardW + padding * 2;
                const canvasH = boardH + padding * 2;
                const boardOffsetX = padding + (canvasW - 2*padding - boardW) / 2;
                const boardOffsetY = padding + (canvasH - 2*padding - boardH) / 2;
                
                // Смещаем правильные позиции в центр canvas
                const offsetX = boardOffsetX - boardMinX;
                const offsetY = boardOffsetY - boardMinY;
                
                pieces.forEach(p => {
                    p.correctX += offsetX;
                    p.correctY += offsetY;
                });
                
                canvas.width = canvasW;
                canvas.height = canvasH;
                
                // Разбрасываем кусочки
                const scattered = [];
                for(let p of pieces) {
                    const pos = getRandomPositionOutside(p.w, p.h, scattered, canvasW, canvasH, boardOffsetX, boardOffsetY, boardW, boardH);
                    p.x = pos.x;
                    p.y = pos.y;
                    scattered.push(p);
                }
                
                console.log(`✅ Загружено ${pieces.length} кусочков`);
                console.log(`📐 Canvas: ${canvasW}x${canvasH}`);
                console.log(`📐 Область сборки: x=${boardOffsetX}, y=${boardOffsetY}, w=${boardW}, h=${boardH}`);
                
                updateProgress();
                draw();
                
                // Сбрасываем камеру
                resetView();
                
            } catch(error) {
                console.error('Ошибка загрузки пазла:', error);
                alert('Не удалось загрузить пазл. Пожалуйста, обновите страницу.');
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }
        
        function draw(){
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#1a2418";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Сетка
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += 100){
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
            
            // Рисуем область сборки (жёлтая рамка)
            if(pieces.length > 0) {
                let boardMinX = Infinity, boardMinY = Infinity;
                let boardMaxX = -Infinity, boardMaxY = -Infinity;
                pieces.forEach(p => {
                    boardMinX = Math.min(boardMinX, p.correctX);
                    boardMinY = Math.min(boardMinY, p.correctY);
                    boardMaxX = Math.max(boardMaxX, p.correctX + p.w);
                    boardMaxY = Math.max(boardMaxY, p.correctY + p.h);
                });
                ctx.strokeStyle = "rgba(255,215,0,0.4)";
                ctx.lineWidth = 4;
                ctx.setLineDash([15, 10]);
                ctx.strokeRect(boardMinX - 10, boardMinY - 10, (boardMaxX - boardMinX) + 20, (boardMaxY - boardMinY) + 20);
                ctx.setLineDash([]);
            }
            
            // Рисуем кусочки
            pieces.forEach(p => {
                const isSelected = (p === selectedPiece && !p.fixed);
                const scaleHover = isSelected ? 1.05 : 1;
                ctx.save();
                let drawX = p.x, drawY = p.y, drawW = p.w, drawH = p.h;
                if (scaleHover !== 1) {
                    const offX = (p.w * (scaleHover - 1)) / 2;
                    const offY = (p.h * (scaleHover - 1)) / 2;
                    drawX = p.x - offX;
                    drawY = p.y - offY;
                    drawW = p.w * scaleHover;
                    drawH = p.h * scaleHover;
                }
                if (isSelected) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = "rgba(255, 215, 0, 0.6)";
                } else {
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = "rgba(0,0,0,0.3)";
                }
                ctx.drawImage(p.img, drawX, drawY, drawW, drawH);
                ctx.shadowBlur = 0;
                
                if (isSelected) {
                    ctx.strokeStyle = "#ffd27a";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(drawX, drawY, drawW, drawH);
                } else if(p.fixed){
                    ctx.strokeStyle = "#4caf50";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(drawX, drawY, drawW, drawH);
                }
                
                // Показываем контур правильной позиции для нефиксированных кусочков
                if (!p.fixed && Math.hypot(p.x - p.correctX, p.y - p.correctY) < 120) {
                    ctx.strokeStyle = "rgba(255, 200, 0, 0.5)";
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 6]);
                    ctx.strokeRect(p.correctX, p.correctY, p.w, p.h);
                    ctx.setLineDash([]);
                }
                ctx.restore();
            });
        }
        
        function checkWin(){
            const allPlaced = pieces.length > 0 && pieces.every(p => p.fixed === true);
            if(allPlaced && gameStarted && !winShown){
                winShown = true;
                setTimeout(() => {
                    winOverlay.classList.remove("hidden");
                    winOverlay.classList.add("active");
                    if(audio && audioEnabled) audio.pause();
                }, 500);
            }
        }
        
        function getCanvasCoords(clientX, clientY){
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }
        
        function getPieceAt(m){
            for(let i = pieces.length-1; i >= 0; i--) {
                const p = pieces[i];
                if(p.fixed) continue;
                if(m.x >= p.x && m.x <= p.x + p.w && m.y >= p.y && m.y <= p.y + p.h) {
                    return p;
                }
            }
            return null;
        }
        
        function onMouseDown(e){
            e.preventDefault();
            if(!gameStarted) return;
            const m = getCanvasCoords(e.clientX, e.clientY);
            const piece = getPieceAt(m);
            if(piece) {
                selectedPiece = piece;
                const group = piece.group || [piece];
                const firstPiece = group[0];
                dragOffsetX = m.x - firstPiece.x;
                dragOffsetY = m.y - firstPiece.y;
                return;
            }
            isDraggingWrapper = true;
            wrapperDragStart.x = e.clientX - panX;
            wrapperDragStart.y = e.clientY - panY;
        }
        
        function onMouseMove(e){
            if(!gameStarted) return;
            if(selectedPiece){
                if(selectedPiece.fixed) {
                    selectedPiece = null;
                    return;
                }
                const m = getCanvasCoords(e.clientX, e.clientY);
                const group = selectedPiece.group || [selectedPiece];
                const firstPiece = group[0];
                const newX = m.x - dragOffsetX;
                const newY = m.y - dragOffsetY;
                const dx = newX - firstPiece.x;
                const dy = newY - firstPiece.y;
                group.forEach(p => {
                    if(!p.fixed) {
                        p.x += dx;
                        p.y += dy;
                    }
                });
                draw();
                return;
            }
            if(isDraggingWrapper){
                panX = e.clientX - wrapperDragStart.x;
                panY = e.clientY - wrapperDragStart.y;
                wrapper.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
            }
        }
        
        function onMouseUp(e){
            if(!gameStarted) return;
            if(selectedPiece){
                if(!selectedPiece.fixed) {
                    const group = selectedPiece.group || [selectedPiece];
                    let snappedToBoard = false;
                    for(let p of group){
                        if(!p.fixed && trySnapToCorrect(p)){ snappedToBoard = true; break; }
                    }
                    if(!snappedToBoard){
                        for(let i = 0; i < group.length; i++) {
                            for(let j = i+1; j < group.length; j++) {
                                trySnapPieces(group[i], group[j]);
                            }
                        }
                        for(let other of pieces) {
                            if(group.includes(other)) continue;
                            for(let p of group) {
                                if(trySnapPieces(p, other)) break;
                            }
                        }
                    }
                }
                selectedPiece = null;
                draw();
            }
            isDraggingWrapper = false;
        }
        
        function onWheel(e){
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            const oldScale = scale;
            scale = Math.min(Math.max(0.3, scale + delta), 3);
            
            // Корректируем pan, чтобы масштабирование было относительно центра экрана
            const rect = wrapper.getBoundingClientRect();
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            panX = centerX - (centerX - panX) * (scale / oldScale);
            panY = centerY - (centerY - panY) * (scale / oldScale);
            
            wrapper.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
        }
        
        function zoom(delta){
            const oldScale = scale;
            scale = Math.min(Math.max(0.3, scale + delta), 3);
            
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            panX = centerX - (centerX - panX) * (scale / oldScale);
            panY = centerY - (centerY - panY) * (scale / oldScale);
            
            wrapper.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
        }
        
        function resetView(){
            if(!pieces.length) return;
            
            // Находим границы всех кусочков
            let minX = Infinity, minY = Infinity;
            let maxX = -Infinity, maxY = -Infinity;
            pieces.forEach(p => {
                minX = Math.min(minX, p.x, p.correctX);
                minY = Math.min(minY, p.y, p.correctY);
                maxX = Math.max(maxX, p.x + p.w, p.correctX + p.w);
                maxY = Math.max(maxY, p.y + p.h, p.correctY + p.h);
            });
            
            const contentW = maxX - minX;
            const contentH = maxY - minY;
            const viewW = window.innerWidth * 0.85;
            const viewH = window.innerHeight * 0.85;
            
            scale = Math.min(viewW / contentW, viewH / contentH, 1.2);
            
            // Центрируем содержимое
            const canvasCenterX = (minX + maxX) / 2;
            const canvasCenterY = (minY + maxY) / 2;
            
            panX = window.innerWidth / 2 - canvasCenterX * scale;
            panY = window.innerHeight / 2 - canvasCenterY * scale;
            
            wrapper.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
        }
        
        function toggleMusic() {
            if(audioEnabled) {
                audio.pause();
                audioEnabled = false;
                musicToggle.innerHTML = "🔇 Включить музыку";
            } else {
                audio.play().catch(()=>{});
                audioEnabled = true;
                musicToggle.innerHTML = "🔇 Выключить музыку";
            }
        }
        
        function downloadTicket() {
            window.location.href = `/download/${PUZZLE_ID}`;
        }
        
        async function startGame(){
            if(gameStarted) return;
            await initPuzzle();
            gameStarted = true;
            winShown = false;
            overlay.classList.add("hidden");
            gameDiv.classList.remove("hidden");
            musicToggle.classList.remove("hidden");
            if(audioEnabled) audio.play().catch(()=>{});
        }
        
        // Обработчики
        startBtn.onclick = startGame;
        startBtn.ontouchstart = (e) => { e.preventDefault(); startGame(); };
        
        document.getElementById('downloadTicketBtn').onclick = downloadTicket;
        musicToggle.onclick = toggleMusic;
        
        zoomInBtn.onclick = () => zoom(0.15);
        zoomOutBtn.onclick = () => zoom(-0.15);
        resetViewBtn.onclick = () => resetView();
        
        canvas.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        window.addEventListener('wheel', onWheel, { passive: false });
        
        // Touch события
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(!gameStarted) return;
            const touch = e.touches[0];
            const m = getCanvasCoords(touch.clientX, touch.clientY);
            const piece = getPieceAt(m);
            if(piece) {
                selectedPiece = piece;
                const group = piece.group || [piece];
                const firstPiece = group[0];
                dragOffsetX = m.x - firstPiece.x;
                dragOffsetY = m.y - firstPiece.y;
                return;
            }
            isDraggingWrapper = true;
            wrapperDragStart.x = touch.clientX - panX;
            wrapperDragStart.y = touch.clientY - panY;
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if(!gameStarted) return;
            const touch = e.touches[0];
            if(selectedPiece){
                if(selectedPiece.fixed) {
                    selectedPiece = null;
                    return;
                }
                const m = getCanvasCoords(touch.clientX, touch.clientY);
                const group = selectedPiece.group || [selectedPiece];
                const firstPiece = group[0];
                const newX = m.x - dragOffsetX;
                const newY = m.y - dragOffsetY;
                const dx = newX - firstPiece.x;
                const dy = newY - firstPiece.y;
                group.forEach(p => {
                    if(!p.fixed) {
                        p.x += dx;
                        p.y += dy;
                    }
                });
                draw();
                return;
            }
            if(isDraggingWrapper){
                panX = touch.clientX - wrapperDragStart.x;
                panY = touch.clientY - wrapperDragStart.y;
                wrapper.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
            }
        });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if(!gameStarted) return;
            if(selectedPiece){
                if(!selectedPiece.fixed) {
                    const group = selectedPiece.group || [selectedPiece];
                    let snappedToBoard = false;
                    for(let p of group){
                        if(!p.fixed && trySnapToCorrect(p)){ snappedToBoard = true; break; }
                    }
                    if(!snappedToBoard){
                        for(let i = 0; i < group.length; i++) {
                            for(let j = i+1; j < group.length; j++) {
                                trySnapPieces(group[i], group[j]);
                            }
                        }
                        for(let other of pieces) {
                            if(group.includes(other)) continue;
                            for(let p of group) {
                                if(trySnapPieces(p, other)) break;
                            }
                        }
                    }
                }
                selectedPiece = null;
                draw();
            }
            isDraggingWrapper = false;
        });
        
        console.log('🎯 Puzzle page ready, puzzle_id:', PUZZLE_ID);
    })();
</script>

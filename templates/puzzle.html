<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🎁 Собери пазл</title>
    <style>
        * {
            user-select: none;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Segoe UI', 'Georgia', serif;
            overflow: hidden;
            height: 100vh;
            background: #0a0c12;
            touch-action: none;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
        }
        
        .invite-text {
            font-size: 1.3rem;
            text-align: center;
            max-width: 600px;
            margin: 20px;
            margin-bottom: 40px;
            color: #ecd9b4;
            background: rgba(0, 0, 0, 0.55);
            padding: 18px 32px;
            border-radius: 80px;
            border: 1px solid #b88b4b;
        }
        
        .compass-btn {
            background: none;
            border: none;
            cursor: pointer;
        }
        
        .compass-btn svg {
            width: 135px;
            height: 135px;
        }
        
        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0b100e;
            cursor: grab;
        }
        
        .game-container:active {
            cursor: grabbing;
        }
        
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            box-shadow: none;
            background: #1e2a1f;
        }
        
        .progress-bar-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 30px;
            padding: 6px;
            backdrop-filter: blur(8px);
            border: 1px solid #dba551;
            z-index: 45;
        }
        
        .progress-bar {
            height: 14px;
            background: linear-gradient(90deg, #e6b85e, #f5d48a);
            border-radius: 30px;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            position: fixed;
            bottom: 50px;
            left: 20px;
            color: #ffefcf;
            font-size: 0.8rem;
            z-index: 45;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }
        
        .control-btn {
            background: #1f1a10cc;
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 10px 20px;
            border: 1px solid #e2b870;
            cursor: pointer;
            color: #ffefcf;
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 120px;
            background: #1f1a10cc;
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 10px 20px;
            border: 1px solid #e2b870;
            cursor: pointer;
            color: #ffefcf;
            z-index: 50;
        }
        
        .win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease;
            background: rgba(0,0,0,0.85);
        }
        
        .win-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .win-content {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 70px;
            padding: 35px 50px;
            text-align: center;
            border: 2px solid #e8c28e;
            max-width: 650px;
        }
        
        .win-content h2 {
            font-size: 2.5rem;
            color: #FFF5E0;
            margin-bottom: 20px;
        }
        
        .ticket-info {
            background: #0a0705aa;
            border-radius: 40px;
            padding: 18px 20px;
            margin: 20px 0;
            border: 1px solid #e8bc7a;
            color: #FFF2D7;
        }
        
        .win-content button {
            background: #6a3e1a;
            border: none;
            padding: 14px 32px;
            font-size: 1.2rem;
            border-radius: 50px;
            color: #FFF2D7;
            cursor: pointer;
            border: 1px solid #e8bc7a;
        }
        
        .hidden { display: none !important; }
        
        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            z-index: 300;
        }
        
        .zoom-info {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 10px;
            color: white;
            font-size: 0.7rem;
            z-index: 45;
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay">
    <div class="invite-text">
        Дорогая, я знаю, как ты любишь пазлы,<br>
        поэтому я подготовил тебе задачку, чтобы получить свой подарок! 😜
    </div>
    <button class="compass-btn" id="startBtn">
        <svg viewBox="0 0 100 100" width="135" height="135">
            <circle cx="50" cy="50" r="45" fill="#2c2416" stroke="#d4af5a" stroke-width="2"/>
            <polygon points="50,15 58,45 50,85 42,45" fill="#d6a447"/>
            <text x="50" y="32" text-anchor="middle" fill="#ecc87b" font-size="10" font-weight="bold">N</text>
        </svg>
    </button>
</div>

<div id="game" class="hidden">
    <div class="game-container" id="gameContainer">
        <canvas id="puzzleCanvas"></canvas>
    </div>
    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">Собрано 0 / 0</div>
    <div class="controls">
        <button class="control-btn" id="zoomOutBtn">−</button>
        <button class="control-btn" id="zoomInBtn">+</button>
        <button class="control-btn" id="resetViewBtn">⊙</button>
    </div>
    <div class="zoom-info" id="zoomInfo">100%</div>
</div>

<div id="winOverlay" class="win-overlay">
    <div class="win-content">
        <div class="violin-icon">🎻</div>
        <h2>🎂 С днём рождения, любимая!</h2>
        <p>Ты собрала пазл — а вот и подарок:</p>
        <div class="ticket-info">
            🎁 Твой билет на концерт!<br>
            📅 С нетерпением жду этого вечера с тобой!
        </div>
        <button id="downloadTicketBtn">📎 Скачать билет</button>
    </div>
</div>

<button id="musicToggle" class="music-btn hidden">🔇 Выключить музыку</button>

<div id="loadingSpinner" class="loading-spinner hidden">Загрузка пазла... 🧩</div>

<script>
    const PUZZLE_ID = '{{ puzzle_id }}';
    
    (function() {
        // Размеры мира
        const WORLD_WIDTH = 50000;
        const WORLD_HEIGHT = 25000;
        const WORLD_CENTER_X = WORLD_WIDTH / 2;
        const WORLD_CENTER_Y = WORLD_HEIGHT / 2;
        
        // Зона разброса кусочков (10000x5000 вокруг центра)
        const SCATTER_ZONE_MIN_X = WORLD_CENTER_X - 5000;
        const SCATTER_ZONE_MAX_X = WORLD_CENTER_X + 5000;
        const SCATTER_ZONE_MIN_Y = WORLD_CENTER_Y - 2500;
        const SCATTER_ZONE_MAX_Y = WORLD_CENTER_Y + 2500;
        
        let pieces = [];
        let selectedPiece = null;
        let selectedGroup = [];
        let dragOffsetX = 0, dragOffsetY = 0;
        
        let canvas = document.getElementById('puzzleCanvas');
        let ctx = canvas.getContext('2d');
        let container = document.getElementById('gameContainer');
        
        let gameStarted = false;
        let winShown = false;
        
        // Камера
        let camera = {
            x: WORLD_CENTER_X,
            y: WORLD_CENTER_Y,
            zoom: 1.0
        };
        
        let isDraggingCamera = false;
        let dragStart = { x: 0, y: 0 };
        let cameraStart = { x: 0, y: 0 };
        
        let audio = new Audio("/static/music.mp3");
        audio.loop = true;
        audio.volume = 0.35;
        
        const overlay = document.getElementById('overlay');
        const gameDiv = document.getElementById('game');
        const winOverlay = document.getElementById('winOverlay');
        const startBtn = document.getElementById('startBtn');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const musicToggle = document.getElementById('musicToggle');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const resetViewBtn = document.getElementById('resetViewBtn');
        const zoomInfo = document.getElementById('zoomInfo');
        let audioEnabled = true;
        
        function updateZoomInfo() {
            zoomInfo.textContent = `${Math.round(camera.zoom * 100)}%`;
        }
        
        function applyCamera() {
            canvas.style.transform = `translate(${-camera.x * camera.zoom + window.innerWidth/2}px, ${-camera.y * camera.zoom + window.innerHeight/2}px) scale(${camera.zoom})`;
        }
        
        function zoom(delta, centerX, centerY) {
            const oldZoom = camera.zoom;
            camera.zoom = Math.min(Math.max(0.3, camera.zoom + delta), 3);
            
            if (centerX !== undefined && centerY !== undefined) {
                camera.x = centerX - (centerX - camera.x) * (camera.zoom / oldZoom);
                camera.y = centerY - (centerY - camera.y) * (camera.zoom / oldZoom);
            }
            
            applyCamera();
            updateZoomInfo();
        }
        
        function resetView() {
            if (!pieces.length) return;
            
            // Находим границы всех кусочков
            let minX = Infinity, minY = Infinity;
            let maxX = -Infinity, maxY = -Infinity;
            
            pieces.forEach(p => {
                minX = Math.min(minX, p.x, p.correctX);
                minY = Math.min(minY, p.y, p.correctY);
                maxX = Math.max(maxX, p.x + p.w, p.correctX + p.w);
                maxY = Math.max(maxY, p.y + p.h, p.correctY + p.h);
            });
            
            const contentW = maxX - minX;
            const contentH = maxY - minY;
            const viewW = window.innerWidth * 0.8;
            const viewH = window.innerHeight * 0.8;
            
            camera.zoom = Math.min(viewW / contentW, viewH / contentH, 1.2);
            camera.x = (minX + maxX) / 2;
            camera.y = (minY + maxY) / 2;
            
            applyCamera();
            updateZoomInfo();
        }
        
        function getGroup(piece) {
            if (!piece.group) return [piece];
            return piece.group;
        }
        
        function mergeGroups(pieceA, pieceB) {
            const groupA = getGroup(pieceA);
            const groupB = getGroup(pieceB);
            
            if (groupA === groupB) return groupA;
            
            const merged = [...groupA, ...groupB];
            merged.forEach(p => p.group = merged);
            
            return merged;
        }
        
        function trySnapPieces(pieceA, pieceB) {
            if (pieceA.group === pieceB.group) return false;
            if (pieceA.fixed || pieceB.fixed) return false;
            
            // Проверяем по правильным позициям
            const deltaCorrectX = (pieceA.correctX + pieceA.w/2) - (pieceB.correctX + pieceB.w/2);
            const deltaCorrectY = (pieceA.correctY + pieceA.h/2) - (pieceB.correctY + pieceB.h/2);
            
            const deltaCurrentX = (pieceA.x + pieceA.w/2) - (pieceB.x + pieceB.w/2);
            const deltaCurrentY = (pieceA.y + pieceA.h/2) - (pieceB.y + pieceB.h/2);
            
            const tolerance = 50;
            
            if (Math.abs(deltaCurrentX - deltaCorrectX) < tolerance && 
                Math.abs(deltaCurrentY - deltaCorrectY) < tolerance) {
                
                const group = mergeGroups(pieceA, pieceB);
                const rootPiece = group[0];
                const rootCorrectX = rootPiece.correctX;
                const rootCorrectY = rootPiece.correctY;
                
                group.forEach(p => {
                    p.x = p.correctX + (rootPiece.x - rootCorrectX);
                    p.y = p.correctY + (rootPiece.y - rootCorrectY);
                });
                
                draw();
                updateProgress();
                return true;
            }
            return false;
        }
        
        function trySnapToCorrect(piece) {
            const group = getGroup(piece);
            const centerPiece = group[0];
            const offsetX = centerPiece.x - centerPiece.correctX;
            const offsetY = centerPiece.y - centerPiece.correctY;
            
            const tolerance = 40;
            
            if (Math.abs(offsetX) < tolerance && Math.abs(offsetY) < tolerance) {
                group.forEach(p => {
                    p.x = p.correctX;
                    p.y = p.correctY;
                    p.fixed = true;
                });
                draw();
                updateProgress();
                return true;
            }
            return false;
        }
        
        async function loadPiecesInfo() {
            const response = await fetch(`/pieces-info/${PUZZLE_ID}`);
            if (!response.ok) throw new Error('Не удалось загрузить информацию о пазле');
            return await response.json();
        }
        
        function loadPieceImage(pieceId) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = `/piece/${PUZZLE_ID}/${pieceId}`;
            });
        }
        
        function getRandomPositionInScatterZone(piece, existingPieces) {
            const maxAttempts = 100;
            
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const x = SCATTER_ZONE_MIN_X + Math.random() * (SCATTER_ZONE_MAX_X - SCATTER_ZONE_MIN_X - piece.w);
                const y = SCATTER_ZONE_MIN_Y + Math.random() * (SCATTER_ZONE_MAX_Y - SCATTER_ZONE_MIN_Y - piece.h);
                
                // Проверяем перекрытие с другими кусочками
                let overlapping = false;
                let overlapCount = 0;
                
                for (let existing of existingPieces) {
                    const overlapX = Math.max(0, Math.min(x + piece.w, existing.x + existing.w) - Math.max(x, existing.x));
                    const overlapY = Math.max(0, Math.min(y + piece.h, existing.y + existing.h) - Math.max(y, existing.y));
                    const overlapArea = overlapX * overlapY;
                    const pieceArea = piece.w * piece.h;
                    
                    if (overlapArea > 0) {
                        overlapCount++;
                        if (overlapArea > pieceArea * 0.3 || overlapCount > 2) {
                            overlapping = true;
                            break;
                        }
                    }
                }
                
                if (!overlapping) {
                    return { x, y };
                }
            }
            
            // Если не нашли место, кладём в угол
            return { x: SCATTER_ZONE_MIN_X + 50, y: SCATTER_ZONE_MIN_Y + 50 };
        }
        
        async function initPuzzle() {
            loadingSpinner.classList.remove('hidden');
            
            try {
                const piecesInfo = await loadPiecesInfo();
                console.log(`📦 Загружено ${piecesInfo.length} кусочков`);
                
                if (piecesInfo.length === 0) {
                    throw new Error('Нет данных о кусочках пазла');
                }
                
                // Загружаем все кусочки и определяем правильные позиции
                pieces = [];
                let puzzleMinX = Infinity, puzzleMinY = Infinity;
                let puzzleMaxX = -Infinity, puzzleMaxY = -Infinity;
                
                for (let i = 0; i < piecesInfo.length; i++) {
                    const info = piecesInfo[i];
                    const img = await loadPieceImage(info.id);
                    
                    pieces.push({
                        id: info.id,
                        img: img,
                        x: 0,
                        y: 0,
                        correctX: info.correct_x,
                        correctY: info.correct_y,
                        w: info.width,
                        h: info.height,
                        fixed: false,
                        group: null
                    });
                    
                    puzzleMinX = Math.min(puzzleMinX, info.correct_x);
                    puzzleMinY = Math.min(puzzleMinY, info.correct_y);
                    puzzleMaxX = Math.max(puzzleMaxX, info.correct_x + info.width);
                    puzzleMaxY = Math.max(puzzleMaxY, info.correct_y + info.height);
                }
                
                // Центрируем пазл в центре мира
                const puzzleCenterX = (puzzleMinX + puzzleMaxX) / 2;
                const puzzleCenterY = (puzzleMinY + puzzleMaxY) / 2;
                const offsetX = WORLD_CENTER_X - puzzleCenterX;
                const offsetY = WORLD_CENTER_Y - puzzleCenterY;
                
                // Разбрасываем кусочки
                const scattered = [];
                
                for (let i = 0; i < pieces.length; i++) {
                    const p = pieces[i];
                    
                    // Смещаем правильные позиции в центр мира
                    p.correctX += offsetX;
                    p.correctY += offsetY;
                    
                    // Получаем случайную позицию в зоне разброса
                    const pos = getRandomPositionInScatterZone(p, scattered);
                    p.x = pos.x;
                    p.y = pos.y;
                    
                    scattered.push(p);
                    
                    console.log(`📌 Кусочек ${i}: correct(${Math.round(p.correctX)}, ${Math.round(p.correctY)}) scatter(${Math.round(p.x)}, ${Math.round(p.y)})`);
                }
                
                // Настраиваем canvas
                canvas.width = WORLD_WIDTH;
                canvas.height = WORLD_HEIGHT;
                
                console.log(`✅ Загружено ${pieces.length} кусочков`);
                console.log(`🌍 Мир: ${WORLD_WIDTH}x${WORLD_HEIGHT}`);
                console.log(`📐 Пазл в центре: (${Math.round(WORLD_CENTER_X)}, ${Math.round(WORLD_CENTER_Y)})`);
                
                updateProgress();
                draw();
                
                // Сбрасываем камеру
                setTimeout(() => resetView(), 100);
                
            } catch (error) {
                console.error('Ошибка загрузки пазла:', error);
                alert('Не удалось загрузить пазл. Пожалуйста, обновите страницу.');
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }
        
        function updateProgress() {
            const fixedCount = pieces.filter(p => p.fixed).length;
            const total = pieces.length;
            const percent = (fixedCount / total) * 100;
            progressBar.style.width = `${percent}%`;
            progressText.innerHTML = `Собрано ${fixedCount} / ${total}`;
            checkWin();
        }
        
        function checkWin() {
            const allPlaced = pieces.length > 0 && pieces.every(p => p.fixed === true);
            if (allPlaced && gameStarted && !winShown) {
                winShown = true;
                setTimeout(() => {
                    winOverlay.classList.remove("hidden");
                    winOverlay.classList.add("active");
                    if (audio && audioEnabled) audio.pause();
                }, 500);
            }
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем фон и сетку мира
            ctx.fillStyle = "#1a2418";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Сетка с шагом 1000 пикселей
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 1000) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
            
            // Рисуем зону разброса (для отладки - можно убрать)
            ctx.strokeStyle = "rgba(100, 150, 255, 0.2)";
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.strokeRect(SCATTER_ZONE_MIN_X, SCATTER_ZONE_MIN_Y, 
                          SCATTER_ZONE_MAX_X - SCATTER_ZONE_MIN_X, 
                          SCATTER_ZONE_MAX_Y - SCATTER_ZONE_MIN_Y);
            ctx.setLineDash([]);
            
            // Рисуем область сборки пазла (контур)
            let boardMinX = Infinity, boardMinY = Infinity;
            let boardMaxX = -Infinity, boardMaxY = -Infinity;
            
            pieces.forEach(p => {
                boardMinX = Math.min(boardMinX, p.correctX);
                boardMinY = Math.min(boardMinY, p.correctY);
                boardMaxX = Math.max(boardMaxX, p.correctX + p.w);
                boardMaxY = Math.max(boardMaxY, p.correctY + p.h);
            });
            
            ctx.strokeStyle = "rgba(255, 215, 0, 0.3)";
            ctx.lineWidth = 3;
            ctx.setLineDash([15, 15]);
            ctx.strokeRect(boardMinX - 20, boardMinY - 20, 
                          (boardMaxX - boardMinX) + 40, 
                          (boardMaxY - boardMinY) + 40);
            ctx.setLineDash([]);
            
            // Рисуем все кусочки
            pieces.forEach(p => {
                if (selectedPiece === p) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = "rgba(255, 215, 0, 0.6)";
                } else {
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = "rgba(0,0,0,0.3)";
                }
                
                ctx.drawImage(p.img, p.x, p.y, p.w, p.h);
                
                if (!p.fixed) {
                    // Показываем контур правильной позиции
                    ctx.strokeStyle = "rgba(255, 210, 90, 0.4)";
                    ctx.lineWidth = 1;
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(p.correctX, p.correctY, p.w, p.h);
                    ctx.setLineDash([]);
                }
                
                if (p.fixed) {
                    ctx.strokeStyle = "#4caf50";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, p.y, p.w, p.h);
                }
            });
            ctx.shadowBlur = 0;
        }
        
        function getCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) / camera.zoom + camera.x - window.innerWidth/2/camera.zoom,
                y: (clientY - rect.top) / camera.zoom + camera.y - window.innerHeight/2/camera.zoom
            };
        }
        
        function getPieceAt(x, y) {
            for (let i = pieces.length - 1; i >= 0; i--) {
                const p = pieces[i];
                if (p.fixed) continue;
                if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) {
                    return p;
                }
            }
            return null;
        }
        
        function onMouseDown(e) {
            e.preventDefault();
            if (!gameStarted) return;
            
            const coord = getCanvasCoords(e.clientX, e.clientY);
            const piece = getPieceAt(coord.x, coord.y);
            
            if (piece && !piece.fixed) {
                selectedPiece = piece;
                selectedGroup = getGroup(piece);
                dragOffsetX = coord.x - piece.x;
                dragOffsetY = coord.y - piece.y;
            } else {
                isDraggingCamera = true;
                dragStart.x = e.clientX;
                dragStart.y = e.clientY;
                cameraStart.x = camera.x;
                cameraStart.y = camera.y;
                container.style.cursor = 'grabbing';
            }
        }
        
        function onMouseMove(e) {
            if (!gameStarted) return;
            
            if (selectedPiece && !selectedPiece.fixed) {
                const coord = getCanvasCoords(e.clientX, e.clientY);
                const newX = coord.x - dragOffsetX;
                const newY = coord.y - dragOffsetY;
                const deltaX = newX - selectedPiece.x;
                const deltaY = newY - selectedPiece.y;
                
                selectedGroup.forEach(p => {
                    p.x += deltaX;
                    p.y += deltaY;
                });
                
                draw();
            } else if (isDraggingCamera) {
                const dx = e.clientX - dragStart.x;
                const dy = e.clientY - dragStart.y;
                camera.x = cameraStart.x - dx / camera.zoom;
                camera.y = cameraStart.y - dy / camera.zoom;
                applyCamera();
            }
        }
        
        function onMouseUp(e) {
            if (!gameStarted) return;
            
            if (selectedPiece && !selectedPiece.fixed) {
                let snapped = trySnapToCorrect(selectedPiece);
                
                if (!snapped) {
                    for (let other of pieces) {
                        if (other === selectedPiece) continue;
                        if (other.fixed) continue;
                        if (trySnapPieces(selectedPiece, other)) {
                            snapped = true;
                            break;
                        }
                    }
                }
                
                selectedPiece = null;
                selectedGroup = [];
                draw();
            }
            
            if (isDraggingCamera) {
                isDraggingCamera = false;
                container.style.cursor = 'grab';
            }
        }
        
        function onWheel(e) {
            e.preventDefault();
            const rect = container.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) / camera.zoom + camera.x - window.innerWidth/2/camera.zoom;
            const mouseY = (e.clientY - rect.top) / camera.zoom + camera.y - window.innerHeight/2/camera.zoom;
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            zoom(delta, mouseX, mouseY);
        }
        
        function toggleMusic() {
            if (audioEnabled) {
                audio.pause();
                audioEnabled = false;
                musicToggle.innerHTML = "🔇 Включить музыку";
            } else {
                audio.play().catch(() => {});
                audioEnabled = true;
                musicToggle.innerHTML = "🔇 Выключить музыку";
            }
        }
        
        function downloadTicket() {
            window.location.href = `/download/${PUZZLE_ID}`;
        }
        
        async function startGame() {
            if (gameStarted) return;
            await initPuzzle();
            gameStarted = true;
            winShown = false;
            overlay.classList.add("hidden");
            gameDiv.classList.remove("hidden");
            musicToggle.classList.remove("hidden");
            if (audioEnabled) audio.play().catch(() => {});
        }
        
        // Обработчики
        startBtn.onclick = startGame;
        startBtn.ontouchstart = (e) => { e.preventDefault(); startGame(); };
        
        document.getElementById('downloadTicketBtn').onclick = downloadTicket;
        musicToggle.onclick = toggleMusic;
        
        zoomInBtn.onclick = () => zoom(0.2);
        zoomOutBtn.onclick = () => zoom(-0.2);
        resetViewBtn.onclick = () => resetView();
        
        container.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        container.addEventListener('wheel', onWheel, { passive: false });
        
        // Touch events
        container.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!gameStarted) return;
            const touch = e.touches[0];
            const coord = getCanvasCoords(touch.clientX, touch.clientY);
            const piece = getPieceAt(coord.x, coord.y);
            if (piece && !piece.fixed) {
                selectedPiece = piece;
                selectedGroup = getGroup(piece);
                dragOffsetX = coord.x - piece.x;
                dragOffsetY = coord.y - piece.y;
            } else {
                isDraggingCamera = true;
                dragStart.x = touch.clientX;
                dragStart.y = touch.clientY;
                cameraStart.x = camera.x;
                cameraStart.y = camera.y;
            }
        });
        
        container.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!gameStarted) return;
            const touch = e.touches[0];
            if (selectedPiece && !selectedPiece.fixed) {
                const coord = getCanvasCoords(touch.clientX, touch.clientY);
                const newX = coord.x - dragOffsetX;
                const newY = coord.y - dragOffsetY;
                const deltaX = newX - selectedPiece.x;
                const deltaY = newY - selectedPiece.y;
                selectedGroup.forEach(p => {
                    p.x += deltaX;
                    p.y += deltaY;
                });
                draw();
            } else if (isDraggingCamera) {
                const dx = touch.clientX - dragStart.x;
                const dy = touch.clientY - dragStart.y;
                camera.x = cameraStart.x - dx / camera.zoom;
                camera.y = cameraStart.y - dy / camera.zoom;
                applyCamera();
            }
        });
        
        container.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!gameStarted) return;
            if (selectedPiece && !selectedPiece.fixed) {
                let snapped = trySnapToCorrect(selectedPiece);
                if (!snapped) {
                    for (let other of pieces) {
                        if (other === selectedPiece) continue;
                        if (other.fixed) continue;
                        if (trySnapPieces(selectedPiece, other)) {
                            snapped = true;
                            break;
                        }
                    }
                }
                selectedPiece = null;
                selectedGroup = [];
                draw();
            }
            isDraggingCamera = false;
        });
        
        console.log('🎯 Puzzle page ready, puzzle_id:', PUZZLE_ID);
    })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🎁 Собери пазл</title>
    <style>
        * {
            user-select: none;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Segoe UI', 'Georgia', serif;
            overflow: hidden;
            height: 100vh;
            background: #0a0c12;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
        }
        
        .invite-text {
            font-size: 1.3rem;
            text-align: center;
            max-width: 600px;
            margin: 20px;
            margin-bottom: 40px;
            color: #ecd9b4;
            background: rgba(0, 0, 0, 0.55);
            padding: 18px 32px;
            border-radius: 80px;
            border: 1px solid #b88b4b;
        }
        
        .compass-btn {
            background: none;
            border: none;
            cursor: pointer;
        }
        
        .compass-btn svg {
            width: 135px;
            height: 135px;
        }
        
        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: auto;
            background: #1a4a1a;
            cursor: grab;
        }
        
        .game-container:active {
            cursor: grabbing;
        }
        
        canvas {
            display: block;
            background: #1a4a1a;
            cursor: grab;
        }
        
        canvas:active {
            cursor: grabbing;
        }
        
        .progress-bar-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 30px;
            padding: 6px;
            backdrop-filter: blur(8px);
            border: 1px solid #dba551;
            z-index: 45;
        }
        
        .progress-bar {
            height: 14px;
            background: linear-gradient(90deg, #e6b85e, #f5d48a);
            border-radius: 30px;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            position: fixed;
            bottom: 50px;
            left: 20px;
            color: #ffefcf;
            font-size: 0.8rem;
            z-index: 45;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }
        
        .control-btn {
            background: #1f1a10cc;
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 10px 20px;
            border: 1px solid #e2b870;
            cursor: pointer;
            color: #ffefcf;
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 120px;
            background: #1f1a10cc;
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 10px 20px;
            border: 1px solid #e2b870;
            cursor: pointer;
            color: #ffefcf;
            z-index: 50;
        }
        
        .win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease;
            background: rgba(0,0,0,0.85);
        }
        
        .win-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .win-content {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 70px;
            padding: 35px 50px;
            text-align: center;
            border: 2px solid #e8c28e;
            max-width: 650px;
        }
        
        .win-content h2 {
            font-size: 2.5rem;
            color: #FFF5E0;
            margin-bottom: 20px;
        }
        
        .ticket-info {
            background: #0a0705aa;
            border-radius: 40px;
            padding: 18px 20px;
            margin: 20px 0;
            border: 1px solid #e8bc7a;
            color: #FFF2D7;
        }
        
        .win-content button {
            background: #6a3e1a;
            border: none;
            padding: 14px 32px;
            font-size: 1.2rem;
            border-radius: 50px;
            color: #FFF2D7;
            cursor: pointer;
            border: 1px solid #e8bc7a;
        }
        
        .hidden { display: none !important; }
        
        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            z-index: 300;
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay">
    <div class="invite-text">
        Дорогая, я знаю, как ты любишь пазлы,<br>
        поэтому я подготовил тебе задачку, чтобы получить свой подарок! 😜
    </div>
    <button class="compass-btn" id="startBtn">
        <svg viewBox="0 0 100 100" width="135" height="135">
            <circle cx="50" cy="50" r="45" fill="#2c2416" stroke="#d4af5a" stroke-width="2"/>
            <polygon points="50,15 58,45 50,85 42,45" fill="#d6a447"/>
            <text x="50" y="32" text-anchor="middle" fill="#ecc87b" font-size="10" font-weight="bold">N</text>
        </svg>
    </button>
</div>

<div id="game" class="hidden">
    <div class="game-container" id="gameContainer">
        <canvas id="puzzleCanvas"></canvas>
    </div>
    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">Собрано 0 / 0</div>
    <div class="controls">
        <button class="control-btn" id="resetViewBtn">⊙ Центрировать</button>
    </div>
</div>

<div id="winOverlay" class="win-overlay">
    <div class="win-content">
        <div class="violin-icon">🎻</div>
        <h2>🎂 С днём рождения, любимая!</h2>
        <p>Ты собрала пазл — а вот и подарок:</p>
        <div class="ticket-info">
            🎁 Твой билет на концерт!<br>
            📅 С нетерпением жду этого вечера с тобой!
        </div>
        <button id="downloadTicketBtn">📎 Скачать билет</button>
    </div>
</div>

<button id="musicToggle" class="music-btn hidden">🔇 Выключить музыку</button>

<div id="loadingSpinner" class="loading-spinner hidden">Загрузка пазла... 🧩</div>

<script>
    const PUZZLE_ID = '{{ puzzle_id }}';
    
    (function() {
        let pieces = [];
        let selectedPiece = null;
        let selectedGroup = [];
        let dragOffsetX = 0, dragOffsetY = 0;
        
        let canvas = document.getElementById('puzzleCanvas');
        let ctx = canvas.getContext('2d');
        let container = document.getElementById('gameContainer');
        
        let gameStarted = false;
        let winShown = false;
        
        // Размеры canvas и области сборки
        let canvasWidth = 0, canvasHeight = 0;
        let boardX = 0, boardY = 0, boardW = 0, boardH = 0;
        
        let audio = new Audio("/static/music.mp3");
        audio.loop = true;
        audio.volume = 0.35;
        
        const overlay = document.getElementById('overlay');
        const gameDiv = document.getElementById('game');
        const winOverlay = document.getElementById('winOverlay');
        const startBtn = document.getElementById('startBtn');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const musicToggle = document.getElementById('musicToggle');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const resetViewBtn = document.getElementById('resetViewBtn');
        let audioEnabled = true;
        
        function getGroup(piece) {
            if (!piece.group) return [piece];
            return piece.group;
        }
        
        function mergeGroups(pieceA, pieceB) {
            const groupA = getGroup(pieceA);
            const groupB = getGroup(pieceB);
            
            if (groupA === groupB) return groupA;
            
            const merged = [...groupA, ...groupB];
            merged.forEach(p => p.group = merged);
            
            return merged;
        }
        
        function trySnapPieces(pieceA, pieceB) {
            if (pieceA.group === pieceB.group) return false;
            if (pieceA.fixed || pieceB.fixed) return false;
            
            const dx = (pieceA.x + pieceA.w/2) - (pieceB.x + pieceB.w/2);
            const dy = (pieceA.y + pieceA.h/2) - (pieceB.y + pieceB.h/2);
            const correctDx = (pieceA.correctX + pieceA.w/2) - (pieceB.correctX + pieceB.w/2);
            const correctDy = (pieceA.correctY + pieceA.h/2) - (pieceB.correctY + pieceB.h/2);
            
            const tolerance = 60;
            
            if (Math.abs(dx - correctDx) < tolerance && Math.abs(dy - correctDy) < tolerance) {
                const group = mergeGroups(pieceA, pieceB);
                const rootPiece = group[0];
                const rootCorrectX = rootPiece.correctX;
                const rootCorrectY = rootPiece.correctY;
                
                group.forEach(p => {
                    p.x = p.correctX + (rootPiece.x - rootCorrectX);
                    p.y = p.correctY + (rootPiece.y - rootCorrectY);
                });
                
                draw();
                updateProgress();
                return true;
            }
            return false;
        }
        
        function trySnapToBoard(piece) {
            const group = getGroup(piece);
            const centerPiece = group[0];
            const offsetX = centerPiece.x - centerPiece.correctX;
            const offsetY = centerPiece.y - centerPiece.correctY;
            
            const tolerance = 50;
            
            if (Math.abs(offsetX) < tolerance && Math.abs(offsetY) < tolerance) {
                group.forEach(p => {
                    p.x = p.correctX;
                    p.y = p.correctY;
                    p.fixed = true;
                });
                draw();
                updateProgress();
                return true;
            }
            return false;
        }
        
        async function loadPiecesInfo() {
            const response = await fetch(`/pieces-info/${PUZZLE_ID}`);
            if (!response.ok) throw new Error('Не удалось загрузить информацию о пазле');
            return await response.json();
        }
        
        function loadPieceImage(pieceId) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = `/piece/${PUZZLE_ID}/${pieceId}`;
            });
        }
        
        function resetView() {
            if (!pieces.length) return;
            
            // Центрируем canvas на область сборки
            const scrollX = boardX + boardW/2 - window.innerWidth/2;
            const scrollY = boardY + boardH/2 - window.innerHeight/2;
            container.scrollTo(scrollX, scrollY);
        }
        
        async function initPuzzle() {
            loadingSpinner.classList.remove('hidden');
            
            try {
                const piecesInfo = await loadPiecesInfo();
                console.log(`📦 Загружено ${piecesInfo.length} кусочков`);
                
                if (piecesInfo.length === 0) {
                    throw new Error('Нет данных о кусочках пазла');
                }
                
                // Загружаем все кусочки
                pieces = [];
                let puzzleMinX = Infinity, puzzleMinY = Infinity;
                let puzzleMaxX = -Infinity, puzzleMaxY = -Infinity;
                
                for (let i = 0; i < piecesInfo.length; i++) {
                    const info = piecesInfo[i];
                    const img = await loadPieceImage(info.id);
                    
                    pieces.push({
                        id: info.id,
                        img: img,
                        x: 0,
                        y: 0,
                        correctX: info.correct_x,
                        correctY: info.correct_y,
                        w: info.width,
                        h: info.height,
                        fixed: false,
                        group: null
                    });
                    
                    puzzleMinX = Math.min(puzzleMinX, info.correct_x);
                    puzzleMinY = Math.min(puzzleMinY, info.correct_y);
                    puzzleMaxX = Math.max(puzzleMaxX, info.correct_x + info.width);
                    puzzleMaxY = Math.max(puzzleMaxY, info.correct_y + info.height);
                }
                
                // Размер собранного пазла
                const puzzleWidth = puzzleMaxX - puzzleMinX;
                const puzzleHeight = puzzleMaxY - puzzleMinY;
                
                // Настраиваем canvas (на 50% больше пазла)
                canvasWidth = Math.max(window.innerWidth * 1.5, puzzleWidth * 2);
                canvasHeight = Math.max(window.innerHeight * 1.5, puzzleHeight * 1.8);
                canvas.width = canvasWidth;
                canvas.height = canvasHeight;
                
                // Центрируем область сборки
                boardW = puzzleWidth;
                boardH = puzzleHeight;
                boardX = (canvasWidth - boardW) / 2;
                boardY = (canvasHeight - boardH) / 2;
                
                // Смещаем правильные позиции кусочков в область сборки
                const offsetX = boardX - puzzleMinX;
                const offsetY = boardY - puzzleMinY;
                
                // Разбрасываем кусочки вокруг области сборки
                const scatterRadius = Math.max(puzzleWidth, puzzleHeight) * 0.8;
                
                for (let i = 0; i < pieces.length; i++) {
                    const p = pieces[i];
                    
                    // Устанавливаем правильные позиции
                    p.correctX += offsetX;
                    p.correctY += offsetY;
                    
                    // Разбрасываем по кругу вокруг области сборки
                    const angle = (i / pieces.length) * Math.PI * 2 + Math.random() * 0.5;
                    const radius = scatterRadius * (0.6 + Math.random() * 0.6);
                    p.x = boardX + boardW/2 + Math.cos(angle) * radius - p.w/2;
                    p.y = boardY + boardH/2 + Math.sin(angle) * radius - p.h/2;
                    
                    // Гарантируем, что кусочек в пределах canvas
                    p.x = Math.min(Math.max(p.x, 20), canvasWidth - p.w - 20);
                    p.y = Math.min(Math.max(p.y, 20), canvasHeight - p.h - 20);
                    
                    console.log(`📌 Кусочек ${i}: correct(${Math.round(p.correctX)}, ${Math.round(p.correctY)}) pos(${Math.round(p.x)}, ${Math.round(p.y)})`);
                }
                
                console.log(`✅ Загружено ${pieces.length} кусочков`);
                console.log(`📐 Canvas: ${canvasWidth}x${canvasHeight}`);
                console.log(`📐 Область сборки: x=${boardX}, y=${boardY}, w=${boardW}, h=${boardH}`);
                
                updateProgress();
                draw();
                
                // Настраиваем скролл
                canvas.style.width = canvasWidth + 'px';
                canvas.style.height = canvasHeight + 'px';
                container.style.overflow = 'auto';
                
                setTimeout(() => resetView(), 100);
                
            } catch (error) {
                console.error('Ошибка загрузки пазла:', error);
                alert('Не удалось загрузить пазл. Пожалуйста, обновите страницу.\n\n' + error.message);
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }
        
        function updateProgress() {
            const fixedCount = pieces.filter(p => p.fixed).length;
            const total = pieces.length;
            const percent = (fixedCount / total) * 100;
            progressBar.style.width = `${percent}%`;
            progressText.innerHTML = `Собрано ${fixedCount} / ${total}`;
            checkWin();
        }
        
        function checkWin() {
            const allPlaced = pieces.length > 0 && pieces.every(p => p.fixed === true);
            if (allPlaced && gameStarted && !winShown) {
                winShown = true;
                setTimeout(() => {
                    winOverlay.classList.remove("hidden");
                    winOverlay.classList.add("active");
                    if (audio && audioEnabled) audio.pause();
                }, 500);
            }
        }
        
        function draw() {
            if (!ctx) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Зелёный фон
            ctx.fillStyle = "#1a4a1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Сетка для ориентира
            ctx.strokeStyle = "rgba(255,255,255,0.1)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 200) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
            
            // Рисуем область сборки (жёлтая рамка)
            ctx.strokeStyle = "rgba(255, 215, 0, 0.5)";
            ctx.lineWidth = 4;
            ctx.setLineDash([15, 15]);
            ctx.strokeRect(boardX, boardY, boardW, boardH);
            ctx.setLineDash([]);
            
            // Рисуем все кусочки
            for (let p of pieces) {
                if (selectedPiece === p) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = "rgba(255, 215, 0, 0.6)";
                } else {
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = "rgba(0,0,0,0.3)";
                }
                
                ctx.drawImage(p.img, p.x, p.y, p.w, p.h);
                
                if (p.fixed) {
                    ctx.strokeStyle = "#4caf50";
                    ctx.lineWidth = 3;
                    ctx.setLineDash([]);
                    ctx.strokeRect(p.x, p.y, p.w, p.h);
                } else if (Math.hypot(p.x - p.correctX, p.y - p.correctY) < 100) {
                    // Подсветка, если кусочек близко к правильному месту
                    ctx.strokeStyle = "rgba(255, 200, 0, 0.6)";
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(p.correctX, p.correctY, p.w, p.h);
                    ctx.setLineDash([]);
                }
            }
            ctx.shadowBlur = 0;
        }
        
        function getPieceAt(canvasX, canvasY) {
            for (let i = pieces.length - 1; i >= 0; i--) {
                const p = pieces[i];
                if (p.fixed) continue;
                if (canvasX >= p.x && canvasX <= p.x + p.w && canvasY >= p.y && canvasY <= p.y + p.h) {
                    return p;
                }
            }
            return null;
        }
        
        // Mouse events
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }
        
        function onMouseDown(e) {
            e.preventDefault();
            if (!gameStarted) return;
            
            const coord = getCanvasCoords(e);
            const piece = getPieceAt(coord.x, coord.y);
            
            if (piece && !piece.fixed) {
                selectedPiece = piece;
                selectedGroup = getGroup(piece);
                dragOffsetX = coord.x - piece.x;
                dragOffsetY = coord.y - piece.y;
                canvas.style.cursor = 'grabbing';
            }
        }
        
        function onMouseMove(e) {
            if (!gameStarted) return;
            
            if (selectedPiece && !selectedPiece.fixed) {
                const coord = getCanvasCoords(e);
                const newX = coord.x - dragOffsetX;
                const newY = coord.y - dragOffsetY;
                const deltaX = newX - selectedPiece.x;
                const deltaY = newY - selectedPiece.y;
                
                selectedGroup.forEach(p => {
                    p.x += deltaX;
                    p.y += deltaY;
                });
                
                draw();
            }
        }
        
        function onMouseUp(e) {
            if (!gameStarted) return;
            
            if (selectedPiece && !selectedPiece.fixed) {
                let snapped = trySnapToBoard(selectedPiece);
                
                if (!snapped) {
                    for (let other of pieces) {
                        if (other === selectedPiece) continue;
                        if (other.fixed) continue;
                        if (trySnapPieces(selectedPiece, other)) {
                            snapped = true;
                            break;
                        }
                    }
                }
                
                selectedPiece = null;
                selectedGroup = [];
                draw();
            }
            
            canvas.style.cursor = 'grab';
        }
        
        function toggleMusic() {
            if (audioEnabled) {
                audio.pause();
                audioEnabled = false;
                musicToggle.innerHTML = "🔇 Включить музыку";
            } else {
                audio.play().catch(() => {});
                audioEnabled = true;
                musicToggle.innerHTML = "🔇 Выключить музыку";
            }
        }
        
        function downloadTicket() {
            window.location.href = `/download/${PUZZLE_ID}`;
        }
        
        async function startGame() {
            if (gameStarted) return;
            await initPuzzle();
            gameStarted = true;
            winShown = false;
            overlay.classList.add("hidden");
            gameDiv.classList.remove("hidden");
            musicToggle.classList.remove("hidden");
            canvas.style.cursor = 'grab';
            if (audioEnabled) audio.play().catch(() => {});
        }
        
        // Обработчики
        startBtn.onclick = startGame;
        startBtn.ontouchstart = (e) => { e.preventDefault(); startGame(); };
        
        document.getElementById('downloadTicketBtn').onclick = downloadTicket;
        musicToggle.onclick = toggleMusic;
        resetViewBtn.onclick = () => resetView();
        
        canvas.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        
        // Touch events
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!gameStarted) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const coord = {
                x: (touch.clientX - rect.left) * scaleX,
                y: (touch.clientY - rect.top) * scaleY
            };
            const piece = getPieceAt(coord.x, coord.y);
            if (piece && !piece.fixed) {
                selectedPiece = piece;
                selectedGroup = getGroup(piece);
                dragOffsetX = coord.x - piece.x;
                dragOffsetY = coord.y - piece.y;
            }
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!gameStarted) return;
            if (selectedPiece && !selectedPiece.fixed) {
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const coord = {
                    x: (touch.clientX - rect.left) * scaleX,
                    y: (touch.clientY - rect.top) * scaleY
                };
                const newX = coord.x - dragOffsetX;
                const newY = coord.y - dragOffsetY;
                const deltaX = newX - selectedPiece.x;
                const deltaY = newY - selectedPiece.y;
                selectedGroup.forEach(p => {
                    p.x += deltaX;
                    p.y += deltaY;
                });
                draw();
            }
        });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!gameStarted) return;
            if (selectedPiece && !selectedPiece.fixed) {
                let snapped = trySnapToBoard(selectedPiece);
                if (!snapped) {
                    for (let other of pieces) {
                        if (other === selectedPiece) continue;
                        if (other.fixed) continue;
                        if (trySnapPieces(selectedPiece, other)) {
                            snapped = true;
                            break;
                        }
                    }
                }
                selectedPiece = null;
                selectedGroup = [];
                draw();
            }
        });
        
        console.log('🎯 Puzzle page ready, puzzle_id:', PUZZLE_ID);
    })();
</script>

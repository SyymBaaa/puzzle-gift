<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 Собери пазл</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a231a;
            min-height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #puzzleBoard {
            position: absolute;
            cursor: grab;
        }
        #puzzleBoard:active { cursor: grabbing; }
        .puzzle-piece {
            position: absolute;
            cursor: grab;
            transition: filter 0.2s;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.3));
        }
        .puzzle-piece:active { cursor: grabbing; filter: drop-shadow(4px 4px 8px rgba(0,0,0,0.4)); }
        .puzzle-piece.placed { 
            filter: drop-shadow(0 0 0 rgba(0,0,0,0)); 
            opacity: 0.9;
            pointer-events: none;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .header h1 { font-size: 24px; color: #333; margin-bottom: 5px; }
        .header p { color: #666; font-size: 14px; }
        .progress-container {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .progress-bar {
            width: 200px;
            height: 12px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text { font-weight: 600; color: #333; min-width: 80px; }
        .gift-block {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            z-index: 2000;
            text-align: center;
            max-width: 90%;
            width: 500px;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        .gift-block h2 { color: #667eea; font-size: 32px; margin-bottom: 20px; }
        .gift-block p { color: #666; margin-bottom: 15px; font-size: 16px; }
        .gift-icon { font-size: 80px; margin-bottom: 20px; }
        .download-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .download-btn:hover { transform: scale(1.05); }
        .instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: #666;
            z-index: 1000;
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 18px;
            z-index: 3000;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">Загрузка пазла...</div>
    <div id="gameContainer">
        <div id="puzzleBoard"></div>
    </div>

    <div class="header">
        <h1>🎁 Собери пазл</h1>
        <p>Дорогая, я знаю, как ты любишь пазлы, поэтому я подготовил тебе задачку! 😜</p>
    </div>

    <div class="progress-container">
        <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
        <div class="progress-text" id="progressText">Собрано 0 / 50</div>
        <span>🎻</span>
    </div>

    <div class="instructions">
        🖱️ Перетаскивай пазлы • Колёсико — зум • Пустое место — панорама
    </div>

    <div class="gift-block" id="giftBlock">
        <div class="gift-icon">🎂</div>
        <h2>С днём рождения, любимая!</h2>
        <p>Ты собрала пазл — а вот и подарок:</p>
        <p><strong>🎁 Твой билет на концерт!</strong></p>
        <a href="/download/{{ puzzle_id }}" class="download-btn" download>📎 Скачать билет</a>
    </div>

    <script>
    // ==================== ГЕНЕРАЦИЯ ФОРМ ПАЗЛОВ ====================
    function createPuzzleShape(pieceWidth, pieceHeight, tabSize, edge) {
        // edge: {top: 1/-1/0, right: 1/-1/0, bottom: 1/-1/0, left: 1/-1/0}
        // 1 = выступ, -1 = выемка, 0 = край
        const w = pieceWidth;
        const h = pieceHeight;
        const t = tabSize;
        
        let path = '';
        
        // Top edge
        if (edge.top === 0) {
            path += `M 0,0 L ${w},0`;
        } else {
            const dir = edge.top;
            path += `M 0,0 `;
            path += `L ${w/2 - t},0 `;
            path += `C ${w/2 - t},${-dir*t*0.3} ${w/2 - t},${-dir*t} ${w/2},${-dir*t} `;
            path += `C ${w/2 + t},${-dir*t} ${w/2 + t},${-dir*t*0.3} ${w/2 + t},0 `;
            path += `L ${w},0`;
        }
        
        // Right edge
        if (edge.right === 0) {
            path += ` L ${w},${h}`;
        } else {
            const dir = edge.right;
            path += ` L ${w},${h/2 - t}`;
            path += `C ${w + dir*t*0.3},${h/2 - t} ${w + dir*t},${h/2 - t} ${w + dir*t},${h/2} `;
            path += `C ${w + dir*t},${h/2 + t} ${w + dir*t*0.3},${h/2 + t} ${w},${h/2 + t} `;
            path += `L ${w},${h}`;
        }
        
        // Bottom edge
        if (edge.bottom === 0) {
            path += ` L 0,${h}`;
        } else {
            const dir = edge.bottom;
            path += ` L ${w/2 + t},${h}`;
            path += `C ${w/2 + t},${h + dir*t*0.3} ${w/2 + t},${h + dir*t} ${w/2},${h + dir*t} `;
            path += `C ${w/2 - t},${h + dir*t} ${w/2 - t},${h + dir*t*0.3} ${w/2 - t},${h} `;
            path += `L 0,${h}`;
        }
        
        // Left edge
        if (edge.left === 0) {
            path += ` Z`;
        } else {
            const dir = edge.left;
            path += ` L 0,${h/2 + t}`;
            path += `C ${0 + dir*t*0.3},${h/2 + t} ${0 + dir*t},${h/2 + t} ${0 + dir*t},${h/2} `;
            path += `C ${0 + dir*t},${h/2 - t} ${0 + dir*t*0.3},${h/2 - t} ${0},${h/2 - t} `;
            path += `Z`;
        }
        
        return path;
    }

    function getRandomEdge(isEdge, neighborExists) {
        if (!neighborExists) return 0; // край доски
        if (!isEdge) return Math.random() > 0.5 ? 1 : -1;
        return 0;
    }

    // ==================== PUZZLE GAME ====================
    class PuzzleGame {
        constructor(containerId, imageUrl, rows = 5, cols = 10) {
            this.container = document.getElementById(containerId);
            this.board = document.getElementById('puzzleBoard');
            this.imageUrl = imageUrl;
            this.rows = rows;
            this.cols = cols;
            this.pieces = [];
            this.placedCount = 0;
            this.totalPieces = rows * cols;
            this.boardWidth = 0;
            this.boardHeight = 0;
            this.pieceWidth = 0;
            this.pieceHeight = 0;
            this.tabSize = 0;
            this.camera = { x: 0, y: 0, scale: 1 };
            this.dragging = null;
            this.dragOffset = { x: 0, y: 0 };
            this.isPanning = false;
            this.lastPointer = { x: 0, y: 0 };
            this.image = null;
            this.svgDefs = null;

            this.init();
        }

        async init() {
            this.setupCamera();
            this.bindEvents();

            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.src = this.imageUrl;
            
            await new Promise((resolve, reject) => {
                img.onload = resolve;
                img.onerror = () => reject(new Error('Не удалось загрузить изображение'));
            });
            
            this.image = img;
            this.setupDimensions();
            this.createSVGDefs();
            this.createPieces();
            this.scatterPieces();
            
            document.getElementById('loading').style.display = 'none';
            this.render();
        }

        setupDimensions() {
            const maxWidth = Math.min(window.innerWidth * 0.9, 1200);
            const maxHeight = window.innerHeight * 0.7;
            
            const scale = Math.min(
                maxWidth / this.image.width,
                maxHeight / this.image.height,
                1
            );
            
            this.boardWidth = this.image.width * scale;
            this.boardHeight = this.image.height * scale;
            this.pieceWidth = this.boardWidth / this.cols;
            this.pieceHeight = this.boardHeight / this.rows;
            this.tabSize = Math.min(this.pieceWidth, this.pieceHeight) * 0.25;
            
            this.board.style.width = `${this.boardWidth}px`;
            this.board.style.height = `${this.boardHeight}px`;
        }

        setupCamera() {
            this.camera.x = window.innerWidth / 2;
            this.camera.y = window.innerHeight / 2;
            this.camera.scale = 1;
        }

        createSVGDefs() {
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.style.position = "absolute";
            svg.style.width = "100%";
            svg.style.height = "100%";
            svg.style.pointerEvents = "none";
            this.board.appendChild(svg);
            
            this.svgDefs = svg;
        }

        createPieces() {
            this.pieces = [];
            const svgNS = "http://www.w3.org/2000/svg";

            for (let r = 0; r < this.rows; r++) {
                for (let c = 0; c < this.cols; c++) {
                    const edge = {
                        top: r === 0 ? 0 : (Math.random() > 0.5 ? 1 : -1),
                        right: c === this.cols - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
                        bottom: r === this.rows - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
                        left: c === 0 ? 0 : (Math.random() > 0.5 ? 1 : -1)
                    };

                    // Корректируем соседние края
                    if (r > 0) {
                        const abovePiece = this.pieces.find(p => p.row === r - 1 && p.col === c);
                        if (abovePiece) {
                            edge.top = -abovePiece.edge.bottom;
                        }
                    }
                    if (c > 0) {
                        const leftPiece = this.pieces.find(p => p.row === r && p.col === c - 1);
                        if (leftPiece) {
                            edge.left = -leftPiece.edge.right;
                        }
                    }

                    const pathData = createPuzzleShape(this.pieceWidth, this.pieceHeight, this.tabSize, edge);
                    
                    const g = document.createElementNS(svgNS, "g");
                    g.classList.add("puzzle-piece");
                    g.setAttribute("data-id", `${c}-${r}`);
                    
                    // Clip path для изображения
                    const clipPath = document.createElementNS(svgNS, "clipPath");
                    const clipId = `clip-${c}-${r}`;
                    clipPath.setAttribute("id", clipId);
                    
                    const clipPathEl = document.createElementNS(svgNS, "path");
                    clipPathEl.setAttribute("d", pathData);
                    clipPath.appendChild(clipPathEl);
                    
                    // Изображение
                    const img = document.createElementNS(svgNS, "image");
                    img.setAttribute("href", this.imageUrl);
                    img.setAttribute("width", this.image.width);
                    img.setAttribute("height", this.image.height);
                    img.setAttribute("clip-path", `url(#${clipId})`);
                    img.setAttribute("x", -c * this.pieceWidth * (this.image.width / this.boardWidth));
                    img.setAttribute("y", -r * this.pieceHeight * (this.image.height / this.boardHeight));
                    img.setAttribute("style", `width: ${this.image.width}px; height: ${this.image.height}px`);
                    
                    // Граница пазла
                    const path = document.createElementNS(svgNS, "path");
                    path.setAttribute("d", pathData);
                    path.setAttribute("fill", "none");
                    path.setAttribute("stroke", "rgba(0,0,0,0.3)");
                    path.setAttribute("stroke-width", "1");
                    
                    g.appendChild(clipPath);
                    g.appendChild(img);
                    g.appendChild(path);
                    this.svgDefs.appendChild(clipPath);
                    
                    const piece = {
                        element: g,
                        id: `${c}-${r}`,
                        row: r,
                        col: c,
                        targetX: c * this.pieceWidth,
                        targetY: r * this.pieceHeight,
                        x: 0,
                        y: 0,
                        edge: edge,
                        isPlaced: false,
                        zIndex: Math.random()
                    };
                    
                    this.pieces.push(piece);
                    this.board.appendChild(g);
                    
                    // Drag events
                    g.addEventListener("mousedown", (e) => this.onPieceMouseDown(e, piece));
                }
            }
        }

        scatterPieces() {
            const margin = 100;
            this.pieces.forEach(p => {
                p.x = (Math.random() - 0.5) * (this.boardWidth + margin * 2);
                p.y = (Math.random() - 0.5) * (this.boardHeight + margin * 2);
                this.updatePiecePosition(p);
            });
        }

        updatePiecePosition(piece) {
            piece.element.style.transform = `translate(${piece.x}px, ${piece.y}px)`;
            piece.element.style.zIndex = Math.floor(piece.zIndex);
        }

        onPieceMouseDown(e, piece) {
            if (piece.isPlaced) return;
            e.preventDefault();
            e.stopPropagation();
            
            this.dragging = piece;
            const rect = this.board.getBoundingClientRect();
            this.dragOffset = {
                x: e.clientX - rect.left - piece.x,
                y: e.clientY - rect.top - piece.y
            };
            piece.zIndex = this.pieces.length + 1;
            this.updatePiecePosition(piece);
        }

        bindEvents() {
            window.addEventListener("mousemove", (e) => {
                if (this.dragging) {
                    const rect = this.board.getBoundingClientRect();
                    this.dragging.x = e.clientX - rect.left - this.dragOffset.x;
                    this.dragging.y = e.clientY - rect.top - this.dragOffset.y;
                    this.updatePiecePosition(this.dragging);
                } else if (this.isPanning) {
                    const dx = e.clientX - this.lastPointer.x;
                    const dy = e.clientY - this.lastPointer.y;
                    this.board.style.left = `${parseFloat(this.board.style.left || 0) + dx}px`;
                    this.board.style.top = `${parseFloat(this.board.style.top || 0) + dy}px`;
                    this.lastPointer = { x: e.clientX, y: e.clientY };
                }
            });

            window.addEventListener("mouseup", () => {
                if (this.dragging) {
                    this.checkSnap(this.dragging);
                    this.dragging = null;
                }
                this.isPanning = false;
            });

            this.board.addEventListener("mousedown", (e) => {
                if (e.target === this.board || e.target.tagName === "svg") {
                    this.isPanning = true;
                    this.lastPointer = { x: e.clientX, y: e.clientY };
                }
            });

            this.board.addEventListener("wheel", (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY > 0 ? 0.95 : 1.05;
                const newScale = Math.max(0.5, Math.min(2, this.camera.scale * zoomFactor));
                this.board.style.transform = `scale(${newScale})`;
                this.camera.scale = newScale;
            }, { passive: false });

            window.addEventListener("resize", () => {
                this.setupDimensions();
                this.pieces.forEach(p => {
                    if (!p.isPlaced) {
                        this.updatePiecePosition(p);
                    }
                });
            });
        }

        checkSnap(piece) {
            const snapThreshold = 30;
            const dx = piece.x - piece.targetX;
            const dy = piece.y - piece.targetY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < snapThreshold) {
                piece.x = piece.targetX;
                piece.y = piece.targetY;
                piece.isPlaced = true;
                piece.element.classList.add("placed");
                this.updatePiecePosition(piece);
                this.placedCount++;
                this.updateUI();
                
                if (this.placedCount === this.totalPieces) {
                    this.triggerWin();
                }
            }
        }

        updateUI() {
            const pct = Math.round((this.placedCount / this.totalPieces) * 100);
            document.getElementById("progressBar").style.width = `${pct}%`;
            document.getElementById("progressText").textContent = 
                `Собрано ${this.placedCount} / ${this.totalPieces}`;
        }

        triggerWin() {
            document.getElementById("giftBlock").style.display = "block";
        }

        render() {
            // Initial render is done by DOM manipulation
        }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        const puzzleId = '{{ puzzle_id }}';
        fetch(`/image/${puzzleId}`)
            .then(res => res.blob())
            .then(blob => URL.createObjectURL(blob))
            .then(url => {
                new PuzzleGame('gameContainer', url, 5, 10);
            })
            .catch(err => {
                console.error('Error:', err);
                document.getElementById('loading').textContent = 'Ошибка загрузки';
            });
    });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🎁 Собери пазл</title>
    <style>
        * {
            user-select: none;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Segoe UI', 'Georgia', serif;
            overflow: hidden;
            height: 100vh;
            background: #0a0c12;
            touch-action: none;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
        }
        
        .invite-text {
            font-size: 1.3rem;
            text-align: center;
            max-width: 600px;
            margin: 20px;
            margin-bottom: 40px;
            color: #ecd9b4;
            background: rgba(0, 0, 0, 0.55);
            padding: 18px 32px;
            border-radius: 80px;
            border: 1px solid #b88b4b;
        }
        
        .compass-btn {
            background: none;
            border: none;
            cursor: pointer;
        }
        
        .compass-btn svg {
            width: 135px;
            height: 135px;
        }
        
        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0b100e;
            cursor: grab;
        }
        
        .game-container:active {
            cursor: grabbing;
        }
        
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            background: #1e2a1f;
        }
        
        .progress-bar-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 30px;
            padding: 6px;
            backdrop-filter: blur(8px);
            border: 1px solid #dba551;
            z-index: 45;
        }
        
        .progress-bar {
            height: 14px;
            background: linear-gradient(90deg, #e6b85e, #f5d48a);
            border-radius: 30px;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            position: fixed;
            bottom: 50px;
            left: 20px;
            color: #ffefcf;
            font-size: 0.8rem;
            z-index: 45;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }
        
        .control-btn {
            background: #1f1a10cc;
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 10px 20px;
            border: 1px solid #e2b870;
            cursor: pointer;
            color: #ffefcf;
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 120px;
            background: #1f1a10cc;
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 10px 20px;
            border: 1px solid #e2b870;
            cursor: pointer;
            color: #ffefcf;
            z-index: 50;
        }
        
        .win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease;
            background: rgba(0,0,0,0.85);
        }
        
        .win-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .win-content {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 70px;
            padding: 35px 50px;
            text-align: center;
            border: 2px solid #e8c28e;
            max-width: 650px;
        }
        
        .win-content h2 {
            font-size: 2.5rem;
            color: #FFF5E0;
            margin-bottom: 20px;
        }
        
        .ticket-info {
            background: #0a0705aa;
            border-radius: 40px;
            padding: 18px 20px;
            margin: 20px 0;
            border: 1px solid #e8bc7a;
            color: #FFF2D7;
        }
        
        .win-content button {
            background: #6a3e1a;
            border: none;
            padding: 14px 32px;
            font-size: 1.2rem;
            border-radius: 50px;
            color: #FFF2D7;
            cursor: pointer;
            border: 1px solid #e8bc7a;
        }
        
        .hidden { display: none !important; }
        
        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            z-index: 300;
        }
        
        .zoom-info {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 10px;
            color: white;
            font-size: 0.7rem;
            z-index: 45;
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay">
    <div class="invite-text">
        Дорогая, я знаю, как ты любишь пазлы,<br>
        поэтому я подготовил тебе задачку, чтобы получить свой подарок! 😜
    </div>
    <button class="compass-btn" id="startBtn">
        <svg viewBox="0 0 100 100" width="135" height="135">
            <circle cx="50" cy="50" r="45" fill="#2c2416" stroke="#d4af5a" stroke-width="2"/>
            <polygon points="50,15 58,45 50,85 42,45" fill="#d6a447"/>
            <text x="50" y="32" text-anchor="middle" fill="#ecc87b" font-size="10" font-weight="bold">N</text>
        </svg>
    </button>
</div>

<div id="game" class="hidden">
    <div class="game-container" id="gameContainer">
        <canvas id="puzzleCanvas"></canvas>
    </div>
    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">Собрано 0 / 0</div>
    <div class="controls">
        <button class="control-btn" id="zoomOutBtn">−</button>
        <button class="control-btn" id="zoomInBtn">+</button>
        <button class="control-btn" id="resetViewBtn">⊙</button>
    </div>
    <div class="zoom-info" id="zoomInfo">100%</div>
</div>

<div id="winOverlay" class="win-overlay">
    <div class="win-content">
        <div class="violin-icon">🎻</div>
        <h2>🎂 С днём рождения, любимая!</h2>
        <p>Ты собрала пазл — а вот и подарок:</p>
        <div class="ticket-info">
            🎁 Твой билет на концерт!<br>
            📅 С нетерпением жду этого вечера с тобой!
        </div>
        <button id="downloadTicketBtn">📎 Скачать билет</button>
    </div>
</div>

<button id="musicToggle" class="music-btn hidden">🔇 Выключить музыку</button>

<div id="loadingSpinner" class="loading-spinner hidden">Загрузка пазла... 🧩</div>

<script>
    const PUZZLE_ID = '{{ puzzle_id }}';
    
    (function() {
        // Размеры мира (упрощаем до разумных)
        let worldWidth = 8000;
        let worldHeight = 6000;
        let worldCenterX = worldWidth / 2;
        let worldCenterY = worldHeight / 2;
        
        let pieces = [];
        let selectedPiece = null;
        let selectedGroup = [];
        let dragOffsetX = 0, dragOffsetY = 0;
        
        let canvas = document.getElementById('puzzleCanvas');
        let ctx = canvas.getContext('2d');
        let container = document.getElementById('gameContainer');
        
        let gameStarted = false;
        let winShown = false;
        
        // Параметры камеры (упрощённые)
        let zoom = 1.0;
        let offsetX = 0, offsetY = 0;  // смещение камеры в пикселях экрана
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;
        let dragStartOffsetX = 0, dragStartOffsetY = 0;
        
        let audio = new Audio("/static/music.mp3");
        audio.loop = true;
        audio.volume = 0.35;
        
        const overlay = document.getElementById('overlay');
        const gameDiv = document.getElementById('game');
        const winOverlay = document.getElementById('winOverlay');
        const startBtn = document.getElementById('startBtn');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const musicToggle = document.getElementById('musicToggle');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const resetViewBtn = document.getElementById('resetViewBtn');
        const zoomInfo = document.getElementById('zoomInfo');
        let audioEnabled = true;
        
        function updateZoomInfo() {
            zoomInfo.textContent = `${Math.round(zoom * 100)}%`;
        }
        
        function applyCamera() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            canvas.style.transform = `translate(${w/2 + offsetX}px, ${h/2 + offsetY}px) scale(${zoom})`;
            canvas.style.transformOrigin = '0 0';
        }
        
        function worldToScreen(x, y) {
            return {
                x: (x - worldCenterX) * zoom + offsetX,
                y: (y - worldCenterY) * zoom + offsetY
            };
        }
        
        function screenToWorld(px, py) {
            return {
                x: (px - offsetX) / zoom + worldCenterX,
                y: (py - offsetY) / zoom + worldCenterY
            };
        }
        
        function setCameraCenter(worldX, worldY) {
            offsetX = 0;
            offsetY = 0;
            worldCenterX = worldX;
            worldCenterY = worldY;
            applyCamera();
        }
        
        function resetView() {
            if (!pieces.length) return;
            
            // Находим границы всех кусочков
            let minX = Infinity, minY = Infinity;
            let maxX = -Infinity, maxY = -Infinity;
            
            pieces.forEach(p => {
                minX = Math.min(minX, p.x, p.correctX);
                minY = Math.min(minY, p.y, p.correctY);
                maxX = Math.max(maxX, p.x + p.w, p.correctX + p.w);
                maxY = Math.max(maxY, p.y + p.h, p.correctY + p.h);
            });
            
            const centerWorldX = (minX + maxX) / 2;
            const centerWorldY = (minY + maxY) / 2;
            const contentW = maxX - minX;
            const contentH = maxY - minY;
            
            const viewW = window.innerWidth * 0.8;
            const viewH = window.innerHeight * 0.8;
            
            zoom = Math.min(viewW / contentW, viewH / contentH, 1.5);
            setCameraCenter(centerWorldX, centerWorldY);
            
            updateZoomInfo();
            draw();
        }
        
        function zoomCamera(delta, screenX, screenY) {
            const oldZoom = zoom;
            const newZoom = Math.min(Math.max(0.3, zoom + delta), 5);
            
            if (screenX !== undefined && screenY !== undefined) {
                // Получаем мировые координаты точки под курсором до зумирования
                const worldBefore = screenToWorld(screenX, screenY);
                zoom = newZoom;
                // После зумирования точка должна остаться на том же месте
                const worldAfter = screenToWorld(screenX, screenY);
                // Корректируем смещение
                offsetX += (worldAfter.x - worldBefore.x) * zoom;
                offsetY += (worldAfter.y - worldBefore.y) * zoom;
            } else {
                zoom = newZoom;
            }
            
            applyCamera();
            updateZoomInfo();
            draw();
        }
        
        function startDrag(screenX, screenY) {
            isDragging = true;
            dragStartX = screenX;
            dragStartY = screenY;
            dragStartOffsetX = offsetX;
            dragStartOffsetY = offsetY;
            container.style.cursor = 'grabbing';
        }
        
        function onDrag(screenX, screenY) {
            if (!isDragging) return;
            const dx = screenX - dragStartX;
            const dy = screenY - dragStartY;
            offsetX = dragStartOffsetX + dx;
            offsetY = dragStartOffsetY + dy;
            applyCamera();
            draw();
        }
        
        function endDrag() {
            isDragging = false;
            container.style.cursor = 'grab';
        }
        
        function getGroup(piece) {
            if (!piece.group) return [piece];
            return piece.group;
        }
        
        function mergeGroups(pieceA, pieceB) {
            const groupA = getGroup(pieceA);
            const groupB = getGroup(pieceB);
            
            if (groupA === groupB) return groupA;
            
            const merged = [...groupA, ...groupB];
            merged.forEach(p => p.group = merged);
            
            return merged;
        }
        
        function trySnapPieces(pieceA, pieceB) {
            if (pieceA.group === pieceB.group) return false;
            if (pieceA.fixed || pieceB.fixed) return false;
            
            const dx = (pieceA.x + pieceA.w/2) - (pieceB.x + pieceB.w/2);
            const dy = (pieceA.y + pieceA.h/2) - (pieceB.y + pieceB.h/2);
            const correctDx = (pieceA.correctX + pieceA.w/2) - (pieceB.correctX + pieceB.w/2);
            const correctDy = (pieceA.correctY + pieceA.h/2) - (pieceB.correctY + pieceB.h/2);
            
            const tolerance = 50;
            
            if (Math.abs(dx - correctDx) < tolerance && Math.abs(dy - correctDy) < tolerance) {
                const group = mergeGroups(pieceA, pieceB);
                const rootPiece = group[0];
                const rootCorrectX = rootPiece.correctX;
                const rootCorrectY = rootPiece.correctY;
                
                group.forEach(p => {
                    p.x = p.correctX + (rootPiece.x - rootCorrectX);
                    p.y = p.correctY + (rootPiece.y - rootCorrectY);
                });
                
                draw();
                updateProgress();
                return true;
            }
            return false;
        }
        
        function trySnapToCorrect(piece) {
            const group = getGroup(piece);
            const centerPiece = group[0];
            const offsetXWorld = centerPiece.x - centerPiece.correctX;
            const offsetYWorld = centerPiece.y - centerPiece.correctY;
            
            const tolerance = 50;
            
            if (Math.abs(offsetXWorld) < tolerance && Math.abs(offsetYWorld) < tolerance) {
                group.forEach(p => {
                    p.x = p.correctX;
                    p.y = p.correctY;
                    p.fixed = true;
                });
                draw();
                updateProgress();
                return true;
            }
            return false;
        }
        
        async function loadPiecesInfo() {
            const response = await fetch(`/pieces-info/${PUZZLE_ID}`);
            if (!response.ok) throw new Error('Не удалось загрузить информацию о пазле');
            return await response.json();
        }
        
        function loadPieceImage(pieceId) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = `/piece/${PUZZLE_ID}/${pieceId}`;
            });
        }
        
        async function initPuzzle() {
            loadingSpinner.classList.remove('hidden');
            
            try {
                const piecesInfo = await loadPiecesInfo();
                console.log(`📦 Загружено ${piecesInfo.length} кусочков`);
                
                if (piecesInfo.length === 0) {
                    throw new Error('Нет данных о кусочках пазла');
                }
                
                // Загружаем все кусочки
                pieces = [];
                let puzzleMinX = Infinity, puzzleMinY = Infinity;
                let puzzleMaxX = -Infinity, puzzleMaxY = -Infinity;
                let maxPieceW = 0, maxPieceH = 0;
                
                for (let i = 0; i < piecesInfo.length; i++) {
                    const info = piecesInfo[i];
                    const img = await loadPieceImage(info.id);
                    
                    maxPieceW = Math.max(maxPieceW, info.width);
                    maxPieceH = Math.max(maxPieceH, info.height);
                    
                    pieces.push({
                        id: info.id,
                        img: img,
                        x: 0,
                        y: 0,
                        correctX: info.correct_x,
                        correctY: info.correct_y,
                        w: info.width,
                        h: info.height,
                        fixed: false,
                        group: null
                    });
                    
                    puzzleMinX = Math.min(puzzleMinX, info.correct_x);
                    puzzleMinY = Math.min(puzzleMinY, info.correct_y);
                    puzzleMaxX = Math.max(puzzleMaxX, info.correct_x + info.width);
                    puzzleMaxY = Math.max(puzzleMaxY, info.correct_y + info.height);
                }
                
                // Настраиваем размер мира под пазл + отступы
                const puzzleWidth = puzzleMaxX - puzzleMinX;
                const puzzleHeight = puzzleMaxY - puzzleMinY;
                worldWidth = Math.max(4000, puzzleWidth * 2.5);
                worldHeight = Math.max(3000, puzzleHeight * 2);
                worldCenterX = worldWidth / 2;
                worldCenterY = worldHeight / 2;
                
                // Центрируем пазл
                const puzzleCenterX = (puzzleMinX + puzzleMaxX) / 2;
                const puzzleCenterY = (puzzleMinY + puzzleMaxY) / 2;
                const offsetToCenterX = worldCenterX - puzzleCenterX;
                const offsetToCenterY = worldCenterY - puzzleCenterY;
                
                // Разбрасываем кусочки вокруг центра
                const scatterRadius = Math.min(puzzleWidth, puzzleHeight) * 1.2;
                
                for (let i = 0; i < pieces.length; i++) {
                    const p = pieces[i];
                    
                    // Смещаем правильные позиции в центр мира
                    p.correctX += offsetToCenterX;
                    p.correctY += offsetToCenterY;
                    
                    // Случайная позиция для разброса
                    const angle = (i / pieces.length) * Math.PI * 2 + Math.random() * 0.5;
                    const radius = scatterRadius * (0.7 + Math.random() * 0.6);
                    p.x = worldCenterX + Math.cos(angle) * radius - p.w / 2;
                    p.y = worldCenterY + Math.sin(angle) * radius - p.h / 2;
                    
                    console.log(`📌 Кусочек ${i}: correct(${Math.round(p.correctX)}, ${Math.round(p.correctY)}) pos(${Math.round(p.x)}, ${Math.round(p.y)})`);
                }
                
                // Настраиваем canvas
                canvas.width = worldWidth;
                canvas.height = worldHeight;
                
                console.log(`✅ Загружено ${pieces.length} кусочков`);
                console.log(`🌍 Мир: ${worldWidth}x${worldHeight}`);
                
                updateProgress();
                draw();
                
                // Сбрасываем камеру
                setTimeout(() => resetView(), 100);
                
            } catch (error) {
                console.error('Ошибка загрузки пазла:', error);
                alert('Не удалось загрузить пазл. Пожалуйста, обновите страницу.\n\n' + error.message);
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }
        
        function updateProgress() {
            const fixedCount = pieces.filter(p => p.fixed).length;
            const total = pieces.length;
            const percent = (fixedCount / total) * 100;
            progressBar.style.width = `${percent}%`;
            progressText.innerHTML = `Собрано ${fixedCount} / ${total}`;
            checkWin();
        }
        
        function checkWin() {
            const allPlaced = pieces.length > 0 && pieces.every(p => p.fixed === true);
            if (allPlaced && gameStarted && !winShown) {
                winShown = true;
                setTimeout(() => {
                    winOverlay.classList.remove("hidden");
                    winOverlay.classList.add("active");
                    if (audio && audioEnabled) audio.pause();
                }, 500);
            }
        }
        
        function draw() {
            if (!ctx) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#1a2418";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Сетка
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 500) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
            
            // Контур области сборки
            if (pieces.length > 0) {
                let boardMinX = Infinity, boardMinY = Infinity;
                let boardMaxX = -Infinity, boardMaxY = -Infinity;
                
                pieces.forEach(p => {
                    boardMinX = Math.min(boardMinX, p.correctX);
                    boardMinY = Math.min(boardMinY, p.correctY);
                    boardMaxX = Math.max(boardMaxX, p.correctX + p.w);
                    boardMaxY = Math.max(boardMaxY, p.correctY + p.h);
                });
                
                ctx.strokeStyle = "rgba(255, 215, 0, 0.3)";
                ctx.lineWidth = 3;
                ctx.setLineDash([10, 10]);
                ctx.strokeRect(boardMinX - 20, boardMinY - 20, 
                              (boardMaxX - boardMinX) + 40, 
                              (boardMaxY - boardMinY) + 40);
                ctx.setLineDash([]);
            }
            
            // Рисуем кусочки
            for (let p of pieces) {
                if (selectedPiece === p) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = "rgba(255, 215, 0, 0.6)";
                } else {
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = "rgba(0,0,0,0.3)";
                }
                
                ctx.drawImage(p.img, p.x, p.y, p.w, p.h);
                
                if (!p.fixed) {
                    ctx.strokeStyle = "rgba(255, 210, 90, 0.4)";
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(p.correctX, p.correctY, p.w, p.h);
                    ctx.setLineDash([]);
                }
                
                if (p.fixed) {
                    ctx.strokeStyle = "#4caf50";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, p.y, p.w, p.h);
                }
            }
            ctx.shadowBlur = 0;
        }
        
        function getPieceAt(worldX, worldY) {
            for (let i = pieces.length - 1; i >= 0; i--) {
                const p = pieces[i];
                if (p.fixed) continue;
                if (worldX >= p.x && worldX <= p.x + p.w && worldY >= p.y && worldY <= p.y + p.h) {
                    return p;
                }
            }
            return null;
        }
        
        // Mouse events
        function onMouseDown(e) {
            e.preventDefault();
            if (!gameStarted) return;
            
            const rect = container.getBoundingClientRect();
            const screenX = e.clientX - rect.width/2;
            const screenY = e.clientY - rect.height/2;
            const world = screenToWorld(screenX, screenY);
            
            const piece = getPieceAt(world.x, world.y);
            
            if (piece && !piece.fixed) {
                selectedPiece = piece;
                selectedGroup = getGroup(piece);
                dragOffsetX = world.x - piece.x;
                dragOffsetY = world.y - piece.y;
                container.style.cursor = 'grabbing';
            } else {
                startDrag(screenX, screenY);
            }
        }
        
        function onMouseMove(e) {
            if (!gameStarted) return;
            
            const rect = container.getBoundingClientRect();
            const screenX = e.clientX - rect.width/2;
            const screenY = e.clientY - rect.height/2;
            
            if (selectedPiece && !selectedPiece.fixed) {
                const world = screenToWorld(screenX, screenY);
                const newWorldX = world.x - dragOffsetX;
                const newWorldY = world.y - dragOffsetY;
                const deltaX = newWorldX - selectedPiece.x;
                const deltaY = newWorldY - selectedPiece.y;
                
                selectedGroup.forEach(p => {
                    p.x += deltaX;
                    p.y += deltaY;
                });
                
                draw();
            } else if (isDragging) {
                onDrag(screenX, screenY);
            }
        }
        
        function onMouseUp(e) {
            if (!gameStarted) return;
            
            if (selectedPiece && !selectedPiece.fixed) {
                let snapped = trySnapToCorrect(selectedPiece);
                
                if (!snapped) {
                    for (let other of pieces) {
                        if (other === selectedPiece) continue;
                        if (other.fixed) continue;
                        if (trySnapPieces(selectedPiece, other)) {
                            snapped = true;
                            break;
                        }
                    }
                }
                
                selectedPiece = null;
                selectedGroup = [];
                draw();
            }
            
            endDrag();
        }
        
        function onWheel(e) {
            e.preventDefault();
            const rect = container.getBoundingClientRect();
            const screenX = e.clientX - rect.width/2;
            const screenY = e.clientY - rect.height/2;
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            zoomCamera(delta, screenX, screenY);
        }
        
        function toggleMusic() {
            if (audioEnabled) {
                audio.pause();
                audioEnabled = false;
                musicToggle.innerHTML = "🔇 Включить музыку";
            } else {
                audio.play().catch(() => {});
                audioEnabled = true;
                musicToggle.innerHTML = "🔇 Выключить музыку";
            }
        }
        
        function downloadTicket() {
            window.location.href = `/download/${PUZZLE_ID}`;
        }
        
        async function startGame() {
            if (gameStarted) return;
            await initPuzzle();
            gameStarted = true;
            winShown = false;
            overlay.classList.add("hidden");
            gameDiv.classList.remove("hidden");
            musicToggle.classList.remove("hidden");
            if (audioEnabled) audio.play().catch(() => {});
        }
        
        // Обработчики
        startBtn.onclick = startGame;
        startBtn.ontouchstart = (e) => { e.preventDefault(); startGame(); };
        
        document.getElementById('downloadTicketBtn').onclick = downloadTicket;
        musicToggle.onclick = toggleMusic;
        
        zoomInBtn.onclick = () => zoomCamera(0.2);
        zoomOutBtn.onclick = () => zoomCamera(-0.2);
        resetViewBtn.onclick = () => resetView();
        
        container.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        container.addEventListener('wheel', onWheel, { passive: false });
        
        // Touch events
        container.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!gameStarted) return;
            const touch = e.touches[0];
            const rect = container.getBoundingClientRect();
            const screenX = touch.clientX - rect.width/2;
            const screenY = touch.clientY - rect.height/2;
            const world = screenToWorld(screenX, screenY);
            const piece = getPieceAt(world.x, world.y);
            if (piece && !piece.fixed) {
                selectedPiece = piece;
                selectedGroup = getGroup(piece);
                dragOffsetX = world.x - piece.x;
                dragOffsetY = world.y - piece.y;
            } else {
                startDrag(screenX, screenY);
            }
        });
        
        container.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!gameStarted) return;
            const touch = e.touches[0];
            const rect = container.getBoundingClientRect();
            const screenX = touch.clientX - rect.width/2;
            const screenY = touch.clientY - rect.height/2;
            if (selectedPiece && !selectedPiece.fixed) {
                const world = screenToWorld(screenX, screenY);
                const newWorldX = world.x - dragOffsetX;
                const newWorldY = world.y - dragOffsetY;
                const deltaX = newWorldX - selectedPiece.x;
                const deltaY = newWorldY - selectedPiece.y;
                selectedGroup.forEach(p => {
                    p.x += deltaX;
                    p.y += deltaY;
                });
                draw();
            } else if (isDragging) {
                onDrag(screenX, screenY);
            }
        });
        
        container.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!gameStarted) return;
            if (selectedPiece && !selectedPiece.fixed) {
                let snapped = trySnapToCorrect(selectedPiece);
                if (!snapped) {
                    for (let other of pieces) {
                        if (other === selectedPiece) continue;
                        if (other.fixed) continue;
                        if (trySnapPieces(selectedPiece, other)) {
                            snapped = true;
                            break;
                        }
                    }
                }
                selectedPiece = null;
                selectedGroup = [];
                draw();
            }
            endDrag();
        });
        
        console.log('🎯 Puzzle page ready, puzzle_id:', PUZZLE_ID);
    })();
</script>
</body>

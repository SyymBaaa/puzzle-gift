<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Puzzle</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #1a2418;
    font-family: sans-serif;
}

#game {
    position: absolute;
    inset: 0;
}

#puzzleWrapper {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center;
}

canvas {
    display: block;
}

#overlay, #winOverlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    color: white;
    z-index: 10;
}

.hidden { display: none; }

button {
    padding: 12px 24px;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="overlay">
    <button id="startBtn">Начать</button>
</div>

<div id="winOverlay" class="hidden">
    <h1>Готово 🎉</h1>
</div>

<div id="game" class="hidden">
    <div id="puzzleWrapper">
        <canvas id="puzzleCanvas"></canvas>
    </div>
</div>

<script>
const PUZZLE_ID = '{{ puzzle_id }}';

(function(){

/* ================= STATE ================= */

let pieces = [];
let selectedPiece = null;
let dragMode = null;

let dragOffsetX = 0;
let dragOffsetY = 0;

let canvas = document.getElementById('puzzleCanvas');
let ctx = canvas.getContext('2d');

let wrapper = document.getElementById('puzzleWrapper');

let scale = 1;
let panX = 0, panY = 0;

let gameStarted = false;

/* ================= HELPERS ================= */

const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));

function getMouse(e){
    const r = canvas.getBoundingClientRect();
    return {
        x:(e.clientX - r.left) * canvas.width / r.width,
        y:(e.clientY - r.top) * canvas.height / r.height
    };
}

/* ================= ALPHA HIT ================= */

function isOpaquePixel(piece, x, y){
    const px = Math.floor((x - piece.x) / piece.w * piece.img.width);
    const py = Math.floor((y - piece.y) / piece.h * piece.img.height);

    if(px < 0 || py < 0 || px >= piece.img.width || py >= piece.img.height) return false;

    const data = piece.hitCtx.getImageData(px, py, 1, 1).data;
    return data[3] > 20;
}

/* ================= GROUP ================= */

function getGroup(p){
    return p.group ? p.group.pieces : [p];
}

function mergeGroups(a, b){
    const g1 = getGroup(a);
    const g2 = getGroup(b);

    const merged = [...new Set([...g1, ...g2])];
    const group = { pieces: merged };

    merged.forEach(p => p.group = group);
}

/* ================= LOAD ================= */

async function initPuzzle(){

    const res = await fetch(`/pieces-info/${PUZZLE_ID}`);
    const data = await res.json();

    const imgs = await Promise.all(data.map(p=>{
        return new Promise(res=>{
            const i = new Image();
            i.onload = ()=>res(i);
            i.src = `/piece/${PUZZLE_ID}/${p.id}`;
        });
    }));

    let maxW = 0, maxH = 0;

    pieces = data.map((p,i)=>{

        const img = imgs[i];

        const hitCanvas = document.createElement('canvas');
        hitCanvas.width = img.width;
        hitCanvas.height = img.height;

        const hitCtx = hitCanvas.getContext('2d');
        hitCtx.drawImage(img,0,0);

        maxW = Math.max(maxW, p.correct_x + p.width);
        maxH = Math.max(maxH, p.correct_y + p.height);

        return {
            id: p.id,
            img,
            hitCtx,
            w: img.width,
            h: img.height,
            correctX: p.correct_x,
            correctY: p.correct_y,
            x: 0,
            y: 0,
            fixed: false,
            group: null
        };
    });

    // ✅ правильный масштаб
    const target = Math.min(window.innerWidth, window.innerHeight) * 0.6;
    const scaleFactor = Math.min(target / Math.max(maxW, maxH), 1);

    pieces.forEach(p=>{
        p.w *= scaleFactor;
        p.h *= scaleFactor;
        p.correctX *= scaleFactor;
        p.correctY *= scaleFactor;
    });

    const padding = 150;

    canvas.width = maxW * scaleFactor + padding * 2;
    canvas.height = maxH * scaleFactor + padding * 2;

    pieces.forEach(p=>{
        p.correctX += padding;
        p.correctY += padding;

        p.x = Math.random() * canvas.width;
        p.y = Math.random() * canvas.height;
    });

    resetView();
    loop();
}

/* ================= DRAW ================= */

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    pieces.forEach(p=>{
        ctx.drawImage(p.img, p.x, p.y, p.w, p.h);
    });
}

/* ================= PICK ================= */

function getPiece(m){
    for(let i = pieces.length-1; i>=0; i--){
        const p = pieces[i];
        if(p.fixed) continue;

        if(
            m.x >= p.x && m.x <= p.x+p.w &&
            m.y >= p.y && m.y <= p.y+p.h &&
            isOpaquePixel(p, m.x, m.y)
        ){
            return p;
        }
    }
}

/* ================= SNAP ================= */

function trySnap(p){

    if(Math.hypot(p.x - p.correctX, p.y - p.correctY) < 30){
        p.x = p.correctX;
        p.y = p.correctY;
        p.fixed = true;
        checkWin();
        return;
    }

    for(const other of pieces){
        if(p === other || other.fixed) continue;

        const dx = p.correctX - other.correctX;
        const dy = p.correctY - other.correctY;

        const targetX = other.x + dx;
        const targetY = other.y + dy;

        if(Math.hypot(p.x - targetX, p.y - targetY) < 30){

            mergeGroups(p, other);

            const g = getGroup(p);
            g.forEach(x=>{
                x.x += (targetX - p.x);
                x.y += (targetY - p.y);
            });

            return;
        }
    }
}

/* ================= INPUT ================= */

canvas.onmousedown = e=>{
    if(!gameStarted) return;

    const m = getMouse(e);
    const piece = getPiece(m);

    if(piece){
        dragMode = 'piece';
        selectedPiece = piece;

        const group = getGroup(piece);
        const base = group[0];

        dragOffsetX = m.x - base.x;
        dragOffsetY = m.y - base.y;

        pieces = pieces.filter(p => !group.includes(p));
        pieces.push(...group);

    } else {
        dragMode = 'canvas';
    }
};

window.onmousemove = e=>{
    if(!gameStarted) return;

    const m = getMouse(e);

    if(dragMode === 'piece' && selectedPiece){

        const group = getGroup(selectedPiece);
        const base = group[0];

        const nx = m.x - dragOffsetX;
        const ny = m.y - dragOffsetY;

        const dx = nx - base.x;
        const dy = ny - base.y;

        group.forEach(p=>{
            if(!p.fixed){
                p.x = clamp(p.x + dx, -200, canvas.width + 200);
                p.y = clamp(p.y + dy, -200, canvas.height + 200);
            }
        });
    }

    if(dragMode === 'canvas'){
        panX += e.movementX;
        panY += e.movementY;
        updateTransform();
    }
};

window.onmouseup = ()=>{
    if(selectedPiece){
        getGroup(selectedPiece).forEach(trySnap);
    }
    selectedPiece = null;
    dragMode = null;
};

/* ================= CAMERA ================= */

function updateTransform(){
    wrapper.style.transform =
        `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
}

window.onwheel = e=>{
    e.preventDefault();
    scale = clamp(scale + (e.deltaY>0?-0.1:0.1), 0.4, 2.5);
    updateTransform();
};

function resetView(){
    scale = 1;
    panX = 0;
    panY = 0;
    updateTransform();
}

/* ================= LOOP ================= */

function loop(){
    draw();
    requestAnimationFrame(loop);
}

/* ================= WIN ================= */

function checkWin(){
    if(pieces.every(p => p.fixed)){
        document.getElementById('winOverlay').classList.remove('hidden');
    }
}

/* ================= START ================= */

document.getElementById('startBtn').onclick = async ()=>{
    if(gameStarted) return;

    await initPuzzle();
    gameStarted = true;

    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
};

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🎁 Собери пазл</title>
    <style>
        * {
            user-select: none;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Segoe UI', 'Georgia', serif;
            overflow: hidden;
            height: 100vh;
            background: #0a0c12;
            touch-action: none;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
        }
        
        .invite-text {
            font-size: 1.3rem;
            text-align: center;
            max-width: 600px;
            margin: 20px;
            margin-bottom: 40px;
            color: #ecd9b4;
            background: rgba(0, 0, 0, 0.55);
            padding: 18px 32px;
            border-radius: 80px;
            border: 1px solid #b88b4b;
        }
        
        .compass-btn {
            background: none;
            border: none;
            cursor: pointer;
        }
        
        .compass-btn svg {
            width: 135px;
            height: 135px;
        }
        
        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0b100e;
        }
        
        .puzzle-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
        }
        
        .puzzle-wrapper:active {
            cursor: grabbing;
        }
        
        canvas {
            display: block;
            box-shadow: 0 0 0 3px #7a5a3a, 0 20px 40px black;
            border-radius: 20px;
            background: #1e2a1f;
        }
        
        .progress-bar-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 30px;
            padding: 6px;
            backdrop-filter: blur(8px);
            border: 1px solid #dba551;
            z-index: 45;
        }
        
        .progress-bar {
            height: 14px;
            background: linear-gradient(90deg, #e6b85e, #f5d48a);
            border-radius: 30px;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            position: fixed;
            bottom: 50px;
            left: 20px;
            color: #ffefcf;
            font-size: 0.8rem;
            z-index: 45;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }
        
        .control-btn {
            background: #1f1a10cc;
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 10px 20px;
            border: 1px solid #e2b870;
            cursor: pointer;
            color: #ffefcf;
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .music-btn {
            background: #1f1a10cc;
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 10px 20px;
            border: 1px solid #e2b870;
            cursor: pointer;
            color: #ffefcf;
        }
        
        .win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease;
            background: rgba(0,0,0,0.85);
        }
        
        .win-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .win-content {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 70px;
            padding: 35px 50px;
            text-align: center;
            border: 2px solid #e8c28e;
            max-width: 650px;
        }
        
        .win-content h2 {
            font-size: 2.5rem;
            color: #FFF5E0;
            margin-bottom: 20px;
        }
        
        .ticket-info {
            background: #0a0705aa;
            border-radius: 40px;
            padding: 18px 20px;
            margin: 20px 0;
            border: 1px solid #e8bc7a;
            color: #FFF2D7;
        }
        
        .win-content button {
            background: #6a3e1a;
            border: none;
            padding: 14px 32px;
            font-size: 1.2rem;
            border-radius: 50px;
            color: #FFF2D7;
            cursor: pointer;
            border: 1px solid #e8bc7a;
        }
        
        .hidden { display: none !important; }
        
        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            z-index: 300;
        }
        
        .zoom-info {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 10px;
            color: white;
            font-size: 0.7rem;
            z-index: 45;
        }
        
        .snap-effect {
            animation: snapFlash 0.2s ease-out;
        }
        
        @keyframes snapFlash {
            0% { filter: brightness(1.5); }
            100% { filter: brightness(1); }
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay">
    <div class="invite-text">
        Дорогая, я знаю, как ты любишь пазлы,<br>
        поэтому я подготовил тебе задачку, чтобы получить свой подарок! 😜
    </div>
    <button class="compass-btn" id="startBtn">
        <svg viewBox="0 0 100 100" width="135" height="135">
            <circle cx="50" cy="50" r="45" fill="#2c2416" stroke="#d4af5a" stroke-width="2"/>
            <polygon points="50,15 58,45 50,85 42,45" fill="#d6a447"/>
            <text x="50" y="32" text-anchor="middle" fill="#ecc87b" font-size="10" font-weight="bold">N</text>
        </svg>
    </button>
</div>

<div id="game" class="hidden">
    <div class="game-container">
        <div class="puzzle-wrapper" id="puzzleWrapper">
            <canvas id="puzzleCanvas"></canvas>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">Собрано 0 / 0</div>
        <div class="controls">
            <button class="control-btn" id="zoomOutBtn">−</button>
            <button class="control-btn" id="zoomInBtn">+</button>
            <button class="control-btn" id="resetViewBtn">⊙</button>
        </div>
        <div class="zoom-info" id="zoomInfo">100%</div>
    </div>
</div>

<div id="winOverlay" class="win-overlay">
    <div class="win-content">
        <div class="violin-icon">🎻</div>
        <h2>🎂 С днём рождения, любимая!</h2>
        <p>Ты собрала пазл — а вот и подарок:</p>
        <div class="ticket-info">
            🎁 Твой билет на концерт!<br>
            📅 С нетерпением жду этого вечера с тобой!
        </div>
        <button id="downloadTicketBtn">📎 Скачать билет</button>
    </div>
</div>

<button id="musicToggle" class="music-btn hidden">🔇 Выключить музыку</button>

<div id="loadingSpinner" class="loading-spinner hidden">Загрузка пазла... 🧩</div>

<script>
    const PUZZLE_ID = '{{ puzzle_id }}';
    
    (function() {
        let pieces = [];
        let selectedPiece = null;
        let selectedGroup = [];
        let dragOffsetX = 0, dragOffsetY = 0;
        let dragStartX = 0, dragStartY = 0;
        
        let canvas = document.getElementById('puzzleCanvas');
        let ctx = canvas.getContext('2d');
        
        let gameStarted = false;
        let winShown = false;
        
        let canvasW, canvasH;
        let scale = 1, panX = 0, panY = 0;
        let wrapper = document.getElementById('puzzleWrapper');
        let isDraggingWrapper = false;
        let wrapperDragStart = {x:0, y:0};
        
        let audio = new Audio("/static/music.mp3");
        audio.loop = true;
        audio.volume = 0.35;
        
        const overlay = document.getElementById('overlay');
        const gameDiv = document.getElementById('game');
        const winOverlay = document.getElementById('winOverlay');
        const startBtn = document.getElementById('startBtn');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const musicToggle = document.getElementById('musicToggle');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const resetViewBtn = document.getElementById('resetViewBtn');
        const zoomInfo = document.getElementById('zoomInfo');
        let audioEnabled = true;
        
        function updateZoomInfo() {
            zoomInfo.textContent = `${Math.round(scale * 100)}%`;
        }
        
        function zoom(delta, centerX, centerY) {
            const oldScale = scale;
            scale = Math.min(Math.max(0.3, scale + delta), 3);
            
            if (centerX !== undefined && centerY !== undefined) {
                const ratio = scale / oldScale;
                panX = centerX - (centerX - panX) * ratio;
                panY = centerY - (centerY - panY) * ratio;
            }
            
            applyTransform();
            updateZoomInfo();
        }
        
        function resetView() {
            if (!pieces.length) return;
            
            let minPieceX = Infinity, minPieceY = Infinity;
            let maxPieceX = -Infinity, maxPieceY = -Infinity;
            
            pieces.forEach(p => {
                minPieceX = Math.min(minPieceX, p.x, p.correctX);
                minPieceY = Math.min(minPieceY, p.y, p.correctY);
                maxPieceX = Math.max(maxPieceX, p.x + p.w, p.correctX + p.w);
                maxPieceY = Math.max(maxPieceY, p.y + p.h, p.correctY + p.h);
            });
            
            const contentW = maxPieceX - minPieceX;
            const contentH = maxPieceY - minPieceY;
            const viewW = window.innerWidth * 0.8;
            const viewH = window.innerHeight * 0.8;
            
            scale = Math.min(viewW / contentW, viewH / contentH, 1.5);
            panX = (window.innerWidth / 2) - (minPieceX + contentW / 2) * scale;
            panY = (window.innerHeight / 2) - (minPieceY + contentH / 2) * scale;
            
            applyTransform();
            updateZoomInfo();
        }
        
        function applyTransform() {
            wrapper.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
        }
        
        // Получить все кусочки в группе
        function getGroup(piece) {
            if (!piece.group) return [piece];
            return piece.group;
        }
        
        // Объединить две группы
        function mergeGroups(pieceA, pieceB) {
            const groupA = getGroup(pieceA);
            const groupB = getGroup(pieceB);
            
            if (groupA === groupB) return groupA;
            
            const merged = [...groupA, ...groupB];
            merged.forEach(p => p.group = merged);
            
            return merged;
        }
        
        // Проверить, можно ли соединить два кусочка
        function trySnapPieces(pieceA, pieceB) {
            // Если уже соединены
            if (pieceA.group === pieceB.group) return false;
            
            // Получаем правильные позиции
            const correctX = pieceA.correctX - pieceB.correctX;
            const correctY = pieceA.correctY - pieceB.correctY;
            
            // Текущая разница в позициях
            const deltaX = pieceA.x - pieceB.x;
            const deltaY = pieceA.y - pieceB.y;
            
            const tolerance = 15; // Допуск в пикселях
            
            // Проверяем, совпадает ли текущее положение с правильным
            if (Math.abs(deltaX - correctX) < tolerance && Math.abs(deltaY - correctY) < tolerance) {
                // Соединяем
                const group = mergeGroups(pieceA, pieceB);
                
                // Выравниваем всю группу по правильным позициям
                const rootPiece = group[0];
                const rootCorrectX = rootPiece.correctX;
                const rootCorrectY = rootPiece.correctY;
                
                group.forEach(p => {
                    p.x = p.correctX + (rootPiece.x - rootCorrectX);
                    p.y = p.correctY + (rootPiece.y - rootCorrectY);
                });
                
                draw();
                updateProgress();
                return true;
            }
            return false;
        }
        
        // Проверить соединение с доской (правильной позицией)
        function trySnapToBoard(piece) {
            const group = getGroup(piece);
            
            // Находим центральный кусок группы
            const centerPiece = group[0];
            const offsetX = centerPiece.x - centerPiece.correctX;
            const offsetY = centerPiece.y - centerPiece.correctY;
            
            // Если группа уже близко к правильному месту
            if (Math.abs(offsetX) < 20 && Math.abs(offsetY) < 20) {
                // Фиксируем всю группу
                group.forEach(p => {
                    p.x = p.correctX;
                    p.y = p.correctY;
                    p.fixed = true;
                });
                draw();
                updateProgress();
                return true;
            }
            return false;
        }
        
        // Загрузка информации о кусочках
        async function loadPiecesInfo() {
            const response = await fetch(`/pieces-info/${PUZZLE_ID}`);
            if (!response.ok) throw new Error('Не удалось загрузить информацию о пазле');
            return await response.json();
        }
        
        // Загрузка изображения кусочка
        function loadPieceImage(pieceId) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = `/piece/${PUZZLE_ID}/${pieceId}`;
            });
        }
        
        // Инициализация пазла
        async function initPuzzle() {
            loadingSpinner.classList.remove('hidden');
            
            try {
                console.log('🧩 Загрузка информации о пазле...');
                const piecesInfo = await loadPiecesInfo();
                console.log(`📦 Загружено ${piecesInfo.length} кусочков`);
                
                if (piecesInfo.length === 0) {
                    throw new Error('Нет данных о кусочках пазла');
                }
                
                // Загружаем изображения всех кусочков
                pieces = [];
                for (let i = 0; i < piecesInfo.length; i++) {
                    const info = piecesInfo[i];
                    const img = await loadPieceImage(info.id);
                    
                    pieces.push({
                        id: info.id,
                        img: img,
                        x: 50 + Math.random() * 600,
                        y: 50 + Math.random() * 400,
                        correctX: info.correct_x,
                        correctY: info.correct_y,
                        w: info.width,
                        h: info.height,
                        fixed: false,
                        group: null
                    });
                    
                    if ((i + 1) % 10 === 0) {
                        console.log(`   Загружено ${i + 1}/${piecesInfo.length}`);
                    }
                }
                
                // Вычисляем размер canvas
                let maxX = 0, maxY = 0;
                pieces.forEach(p => {
                    maxX = Math.max(maxX, p.correctX + p.w);
                    maxY = Math.max(maxY, p.correctY + p.h);
                });
                
                canvasW = Math.max(1400, maxX + 200);
                canvasH = Math.max(1000, maxY + 200);
                canvas.width = canvasW;
                canvas.height = canvasH;
                
                console.log(`✅ Загружено ${pieces.length} кусочков`);
                console.log(`📐 Canvas размер: ${canvasW}x${canvasH}`);
                
                updateProgress();
                draw();
                
                setTimeout(() => resetView(), 100);
                
            } catch (error) {
                console.error('Ошибка загрузки пазла:', error);
                alert('Не удалось загрузить пазл. Пожалуйста, обновите страницу.');
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }
        
        function updateProgress() {
            const fixedCount = pieces.filter(p => p.fixed).length;
            const total = pieces.length;
            const percent = (fixedCount / total) * 100;
            progressBar.style.width = `${percent}%`;
            progressText.innerHTML = `Собрано ${fixedCount} / ${total}`;
            checkWin();
        }
        
        function checkWin() {
            const allPlaced = pieces.length > 0 && pieces.every(p => p.fixed === true);
            if (allPlaced && gameStarted && !winShown) {
                winShown = true;
                setTimeout(() => {
                    winOverlay.classList.remove("hidden");
                    winOverlay.classList.add("active");
                    if (audio && audioEnabled) audio.pause();
                }, 500);
            }
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем фон
            ctx.fillStyle = "#1a2418";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем сетку
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 100) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
            
            // Рисуем все кусочки
            pieces.forEach(p => {
                if (selectedPiece === p) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = "rgba(255, 215, 0, 0.6)";
                } else {
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = "rgba(0,0,0,0.3)";
                }
                
                ctx.drawImage(p.img, p.x, p.y, p.w, p.h);
                
                if (p.fixed) {
                    ctx.strokeStyle = "#4caf50";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(p.x, p.y, p.w, p.h);
                }
            });
            ctx.shadowBlur = 0;
        }
        
        function getCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }
        
        function getPieceAt(x, y) {
            for (let i = pieces.length - 1; i >= 0; i--) {
                const p = pieces[i];
                if (p.fixed) continue;
                if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) {
                    return p;
                }
            }
            return null;
        }
        
        function onMouseDown(e) {
            e.preventDefault();
            if (!gameStarted) return;
            const coord = getCanvasCoords(e.clientX, e.clientY);
            const piece = getPieceAt(coord.x, coord.y);
            if (piece && !piece.fixed) {
                selectedPiece = piece;
                selectedGroup = getGroup(piece);
                dragOffsetX = coord.x - piece.x;
                dragOffsetY = coord.y - piece.y;
                dragStartX = piece.x;
                dragStartY = piece.y;
            } else {
                isDraggingWrapper = true;
                wrapperDragStart.x = e.clientX - panX;
                wrapperDragStart.y = e.clientY - panY;
            }
        }
        
        function onMouseMove(e) {
            if (!gameStarted) return;
            if (selectedPiece && !selectedPiece.fixed) {
                const coord = getCanvasCoords(e.clientX, e.clientY);
                const newX = coord.x - dragOffsetX;
                const newY = coord.y - dragOffsetY;
                const deltaX = newX - selectedPiece.x;
                const deltaY = newY - selectedPiece.y;
                
                // Перемещаем всю группу
                selectedGroup.forEach(p => {
                    p.x += deltaX;
                    p.y += deltaY;
                });
                
                draw();
            } else if (isDraggingWrapper) {
                panX = e.clientX - wrapperDragStart.x;
                panY = e.clientY - wrapperDragStart.y;
                applyTransform();
            }
        }
        
        function onMouseUp(e) {
            if (!gameStarted) return;
            if (selectedPiece && !selectedPiece.fixed) {
                // Сначала пробуем соединить с доской
                let snapped = trySnapToBoard(selectedPiece);
                
                // Если не соединилось с доской, пробуем соединить с другими кусочками
                if (!snapped) {
                    for (let other of pieces) {
                        if (other === selectedPiece) continue;
                        if (other.fixed) continue;
                        if (trySnapPieces(selectedPiece, other)) {
                            snapped = true;
                            break;
                        }
                    }
                }
                
                selectedPiece = null;
                selectedGroup = [];
                draw();
            }
            isDraggingWrapper = false;
        }
        
        function onTouchStart(e) {
            e.preventDefault();
            if (!gameStarted) return;
            const touch = e.touches[0];
            const coord = getCanvasCoords(touch.clientX, touch.clientY);
            const piece = getPieceAt(coord.x, coord.y);
            if (piece && !piece.fixed) {
                selectedPiece = piece;
                selectedGroup = getGroup(piece);
                dragOffsetX = coord.x - piece.x;
                dragOffsetY = coord.y - piece.y;
                dragStartX = piece.x;
                dragStartY = piece.y;
            } else {
                isDraggingWrapper = true;
                wrapperDragStart.x = touch.clientX - panX;
                wrapperDragStart.y = touch.clientY - panY;
            }
        }
        
        function onTouchMove(e) {
            e.preventDefault();
            if (!gameStarted) return;
            if (selectedPiece && !selectedPiece.fixed) {
                const touch = e.touches[0];
                const coord = getCanvasCoords(touch.clientX, touch.clientY);
                const newX = coord.x - dragOffsetX;
                const newY = coord.y - dragOffsetY;
                const deltaX = newX - selectedPiece.x;
                const deltaY = newY - selectedPiece.y;
                
                selectedGroup.forEach(p => {
                    p.x += deltaX;
                    p.y += deltaY;
                });
                
                draw();
            } else if (isDraggingWrapper) {
                const touch = e.touches[0];
                panX = touch.clientX - wrapperDragStart.x;
                panY = touch.clientY - wrapperDragStart.y;
                applyTransform();
            }
        }
        
        function onTouchEnd(e) {
            e.preventDefault();
            if (!gameStarted) return;
            if (selectedPiece && !selectedPiece.fixed) {
                let snapped = trySnapToBoard(selectedPiece);
                
                if (!snapped) {
                    for (let other of pieces) {
                        if (other === selectedPiece) continue;
                        if (other.fixed) continue;
                        if (trySnapPieces(selectedPiece, other)) {
                            snapped = true;
                            break;
                        }
                    }
                }
                
                selectedPiece = null;
                selectedGroup = [];
                draw();
            }
            isDraggingWrapper = false;
        }
        
        function onWheel(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            zoom(delta, mouseX, mouseY);
        }
        
        function toggleMusic() {
            if (audioEnabled) {
                audio.pause();
                audioEnabled = false;
                musicToggle.innerHTML = "🔇 Включить музыку";
            } else {
                audio.play().catch(() => {});
                audioEnabled = true;
                musicToggle.innerHTML = "🔇 Выключить музыку";
            }
        }
        
        function downloadTicket() {
            window.location.href = `/download/${PUZZLE_ID}`;
        }
        
        async function startGame() {
            if (gameStarted) return;
            await initPuzzle();
            gameStarted = true;
            winShown = false;
            overlay.classList.add("hidden");
            gameDiv.classList.remove("hidden");
            musicToggle.classList.remove("hidden");
            if (audioEnabled) audio.play().catch(() => {});
        }
        
        startBtn.onclick = startGame;
        startBtn.ontouchstart = (e) => { e.preventDefault(); startGame(); };
        
        document.getElementById('downloadTicketBtn').onclick = downloadTicket;
        musicToggle.onclick = toggleMusic;
        
        zoomInBtn.onclick = () => zoom(0.2);
        zoomOutBtn.onclick = () => zoom(-0.2);
        resetViewBtn.onclick = () => resetView();
        
        canvas.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        window.addEventListener('wheel', onWheel, { passive: false });
        
        canvas.addEventListener('touchstart', onTouchStart, { passive: false });
        canvas.addEventListener('touchmove', onTouchMove, { passive: false });
        canvas.addEventListener('touchend', onTouchEnd);
        canvas.addEventListener('touchcancel', onTouchEnd);
        
        console.log('🎯 Puzzle page ready, puzzle_id:', PUZZLE_ID);
    })();
</script>
</body>
</html>

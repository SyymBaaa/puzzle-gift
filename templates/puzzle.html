<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🎁 Собери пазл</title>
    <style>
        * {
            user-select: none;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Segoe UI', 'Georgia', serif;
            overflow: hidden;
            height: 100vh;
            background: #0a0c12;
            touch-action: none;
        }
        
        /* Overlay и всё остальное оставляем как было */
        .overlay { /* ... твой стиль ... */ }
        .invite-text { /* ... */ }
        .compass-btn { /* ... */ }
        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0b100e;
        }
        
        .puzzle-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
        }
        
        .puzzle-wrapper:active {
            cursor: grabbing;
        }
        
        canvas {
            display: block;
            box-shadow: 0 0 0 3px #7a5a3a, 0 20px 40px black;
            border-radius: 20px;
            background: #1e2a1f;
        }
        
        .progress-bar-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 30px;
            padding: 6px;
            backdrop-filter: blur(8px);
            border: 1px solid #dba551;
            z-index: 45;
        }
        
        .progress-bar {
            height: 14px;
            background: linear-gradient(90deg, #e6b85e, #f5d48a);
            border-radius: 30px;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            position: fixed;
            bottom: 50px;
            left: 20px;
            color: #ffefcf;
            font-size: 0.8rem;
            z-index: 45;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
        }
        
        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1f1a10cc;
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 10px 20px;
            z-index: 50;
            border: 1px solid #e2b870;
            cursor: pointer;
            color: #ffefcf;
        }
        
        .win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease;
            background: rgba(0,0,0,0.85);
        }
        
        .win-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .win-content {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 70px;
            padding: 35px 50px;
            text-align: center;
            border: 2px solid #e8c28e;
            max-width: 650px;
        }
        
        .win-content h2 {
            font-size: 2.5rem;
            color: #FFF5E0;
            margin-bottom: 20px;
        }
        
        .ticket-info {
            background: #0a0705aa;
            border-radius: 40px;
            padding: 18px 20px;
            margin: 20px 0;
            border: 1px solid #e8bc7a;
            color: #FFF2D7;
        }
        
        .win-content button {
            background: #6a3e1a;
            border: none;
            padding: 14px 32px;
            font-size: 1.2rem;
            border-radius: 50px;
            color: #FFF2D7;
            cursor: pointer;
            border: 1px solid #e8bc7a;
        }
        
        .hidden { display: none !important; }
        
        @media (max-width: 768px) {
            .cursor-particle { display: none; }
        }
    </style>
</head>
<body>

<!-- Твой overlay и startBtn -->
<div class="overlay" id="overlay">
    <div class="invite-text">
        Дорогая, я знаю, как ты любишь пазлы,<br>
        поэтому я подготовил тебе задачку, чтобы получить свой подарок! 😜
    </div>
    <button class="compass-btn" id="startBtn">
        <svg viewBox="0 0 100 100" width="135" height="135">
            <circle cx="50" cy="50" r="45" fill="#2c2416" stroke="#d4af5a" stroke-width="2"/>
            <polygon points="50,15 58,45 50,85 42,45" fill="#d6a447"/>
            <text x="50" y="32" text-anchor="middle" fill="#ecc87b" font-size="10" font-weight="bold">N</text>
        </svg>
    </button>
</div>

<div id="game" class="hidden">
    <div class="game-container">
        <div class="puzzle-wrapper" id="puzzleWrapper">
            <canvas id="puzzleCanvas"></canvas>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">Собрано 0 / 0</div>
    </div>
</div>

<div id="winOverlay" class="win-overlay">
    <div class="win-content">
        <div class="violin-icon">🎻</div>
        <h2>🎂 С днём рождения, любимая!</h2>
        <p>Ты собрала пазл — а вот и подарок:</p>
        <div class="ticket-info">
            🎁 Твой билет на концерт!<br>
            📅 С нетерпением жду этого вечера с тобой!
        </div>
        <button id="downloadTicketBtn">📎 Скачать билет</button>
    </div>
</div>

<button id="musicToggle" class="music-btn hidden">🔇 Выключить музыку</button>

<script>
    const PUZZLE_ID = '{{ puzzle_id }}';
    
    (function() {
        let pieces = [];           // массив кусочков: { id, img, x, y, correctX, correctY, w, h, fixed, group }
        let selectedPiece = null;
        let dragOffsetX = 0, dragOffsetY = 0;
        
        let canvas = document.getElementById('puzzleCanvas');
        let ctx = canvas.getContext('2d');
        
        let gameStarted = false;
        let winShown = false;
        
        let boardOffsetX, boardOffsetY, boardW, boardH;
        let scale = 1, panX = 0, panY = 0;
        let wrapper = document.getElementById('puzzleWrapper');
        let isDraggingWrapper = false;
        let wrapperDragStart = {x:0, y:0};
        
        let audio = new Audio("/static/music.mp3");
        audio.loop = true;
        audio.volume = 0.35;
        
        const overlay = document.getElementById('overlay');
        const gameDiv = document.getElementById('game');
        const winOverlay = document.getElementById('winOverlay');
        const startBtn = document.getElementById('startBtn');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const musicToggle = document.getElementById('musicToggle');
        let audioEnabled = true;
        
        // Загрузка информации о кусочках
        async function loadPiecesInfo() {
            const response = await fetch(`/pieces-info/${PUZZLE_ID}`);
            if (!response.ok) throw new Error('Не удалось загрузить информацию о пазле');
            return await response.json();
        }
        
        // Загрузка изображения кусочка
        function loadPieceImage(pieceId) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = `/piece/${PUZZLE_ID}/${pieceId}`;
            });
        }
        
        // Инициализация пазла
        async function initPuzzle() {
            console.log('🧩 Загрузка информации о пазле...');
            const piecesInfo = await loadPiecesInfo();
            console.log(`📦 Загружено ${piecesInfo.length} кусочков`);
            
            // Определяем размеры доски (по максимальным bounding box)
            let maxX = 0, maxY = 0;
            piecesInfo.forEach(p => {
                maxX = Math.max(maxX, p.correct_x + p.width / 2);
                maxY = Math.max(maxY, p.correct_y + p.height / 2);
            });
            
            const padding = 100;
            boardW = maxX + padding * 2;
            boardH = maxY + padding * 2;
            
            canvas.width = boardW;
            canvas.height = boardH;
            boardOffsetX = padding;
            boardOffsetY = padding;
            
            // Загружаем изображения всех кусочков
            pieces = [];
            for (let i = 0; i < piecesInfo.length; i++) {
                const info = piecesInfo[i];
                const img = await loadPieceImage(info.id);
                
                // Случайная позиция (разбрасываем)
                const randomX = padding + Math.random() * (boardW - info.width - padding);
                const randomY = padding + Math.random() * (boardH - info.height - padding);
                
                pieces.push({
                    id: info.id,
                    img: img,
                    x: randomX,
                    y: randomY,
                    correctX: info.correct_x + padding - info.width/2,
                    correctY: info.correct_y + padding - info.height/2,
                    w: info.width,
                    h: info.height,
                    fixed: false,
                    group: null
                });
            }
            
            console.log(`✅ Загружено ${pieces.length} кусочков`);
            updateProgress();
            draw();
        }
        
        function updateProgress() {
            const fixedCount = pieces.filter(p => p.fixed).length;
            const total = pieces.length;
            const percent = (fixedCount / total) * 100;
            progressBar.style.width = `${percent}%`;
            progressText.innerHTML = `Собрано ${fixedCount} / ${total}`;
            checkWin();
        }
        
        function checkWin() {
            const allPlaced = pieces.length > 0 && pieces.every(p => p.fixed === true);
            if (allPlaced && gameStarted && !winShown) {
                winShown = true;
                setTimeout(() => {
                    winOverlay.classList.remove("hidden");
                    winOverlay.classList.add("active");
                    if (audio && audioEnabled) audio.pause();
                }, 500);
            }
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем фон
            ctx.fillStyle = "#1a2418";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем контуры правильных позиций (для ещё не зафиксированных кусочков)
            pieces.forEach(p => {
                if (!p.fixed) {
                    ctx.strokeStyle = "rgba(255, 210, 90, 0.5)";
                    ctx.lineWidth = 2;
                    ctx.setLineDash([8, 6]);
                    ctx.strokeRect(p.correctX, p.correctY, p.w, p.h);
                    ctx.setLineDash([]);
                }
            });
            
            // Рисуем кусочки (от задних к передним, если есть z-index)
            pieces.forEach(p => {
                if (p === selectedPiece && !p.fixed) {
                    // подсветка выбранного
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = "rgba(255, 215, 0, 0.6)";
                } else {
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = "rgba(0,0,0,0.3)";
                }
                
                ctx.drawImage(p.img, p.x, p.y, p.w, p.h);
                
                if (p.fixed) {
                    ctx.strokeStyle = "#4caf50";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(p.x, p.y, p.w, p.h);
                }
            });
            ctx.shadowBlur = 0;
        }
        
        // Проверка, находится ли кусочек рядом со своей правильной позицией
        function trySnapToCorrect(piece) {
            const snapDistance = 40;
            const dx = piece.x - piece.correctX;
            const dy = piece.y - piece.correctY;
            const dist = Math.hypot(dx, dy);
            
            if (dist < snapDistance) {
                // Анимация
                piece.x = piece.correctX;
                piece.y = piece.correctY;
                piece.fixed = true;
                draw();
                updateProgress();
                return true;
            }
            return false;
        }
        
        // Снаппинг между кусочками (группировка)
        function trySnapToPiece(piece) {
            const snapDist = 30;
            
            for (let other of pieces) {
                if (other === piece) continue;
                if (other.fixed) continue;
                
                // Проверяем, можно ли прилепить текущий кусочек к другому
                // (упрощённо: если они близко по координатам)
                const dx = piece.x - other.x;
                const dy = piece.y - other.y;
                const dist = Math.hypot(dx, dy);
                
                if (dist < snapDist) {
                    // Прилепляем
                    piece.x = other.x;
                    piece.y = other.y;
                    draw();
                    return true;
                }
            }
            return false;
        }
        
        // Координаты мыши/тача относительно canvas
        function getCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }
        
        // Какой кусочек под курсором
        function getPieceAt(x, y) {
            for (let i = pieces.length - 1; i >= 0; i--) {
                const p = pieces[i];
                if (p.fixed) continue;
                if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) {
                    return p;
                }
            }
            return null;
        }
        
        // Обработчики мыши
        function onMouseDown(e) {
            e.preventDefault();
            if (!gameStarted) return;
            const coord = getCanvasCoords(e.clientX, e.clientY);
            const piece = getPieceAt(coord.x, coord.y);
            if (piece) {
                selectedPiece = piece;
                dragOffsetX = coord.x - piece.x;
                dragOffsetY = coord.y - piece.y;
            } else {
                isDraggingWrapper = true;
                wrapperDragStart.x = e.clientX - panX;
                wrapperDragStart.y = e.clientY - panY;
            }
        }
        
        function onMouseMove(e) {
            if (!gameStarted) return;
            if (selectedPiece && !selectedPiece.fixed) {
                const coord = getCanvasCoords(e.clientX, e.clientY);
                selectedPiece.x = coord.x - dragOffsetX;
                selectedPiece.y = coord.y - dragOffsetY;
                draw();
            } else if (isDraggingWrapper) {
                panX = e.clientX - wrapperDragStart.x;
                panY = e.clientY - wrapperDragStart.y;
                wrapper.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
            }
        }
        
        function onMouseUp(e) {
            if (!gameStarted) return;
            if (selectedPiece && !selectedPiece.fixed) {
                let snapped = trySnapToCorrect(selectedPiece);
                if (!snapped) {
                    trySnapToPiece(selectedPiece);
                }
                selectedPiece = null;
                draw();
            }
            isDraggingWrapper = false;
        }
        
        // Тач-события
        function onTouchStart(e) {
            e.preventDefault();
            if (!gameStarted) return;
            const touch = e.touches[0];
            const coord = getCanvasCoords(touch.clientX, touch.clientY);
            const piece = getPieceAt(coord.x, coord.y);
            if (piece) {
                selectedPiece = piece;
                dragOffsetX = coord.x - piece.x;
                dragOffsetY = coord.y - piece.y;
            } else {
                isDraggingWrapper = true;
                wrapperDragStart.x = touch.clientX - panX;
                wrapperDragStart.y = touch.clientY - panY;
            }
        }
        
        function onTouchMove(e) {
            e.preventDefault();
            if (!gameStarted) return;
            if (selectedPiece && !selectedPiece.fixed) {
                const touch = e.touches[0];
                const coord = getCanvasCoords(touch.clientX, touch.clientY);
                selectedPiece.x = coord.x - dragOffsetX;
                selectedPiece.y = coord.y - dragOffsetY;
                draw();
            } else if (isDraggingWrapper) {
                const touch = e.touches[0];
                panX = touch.clientX - wrapperDragStart.x;
                panY = touch.clientY - wrapperDragStart.y;
                wrapper.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
            }
        }
        
        function onTouchEnd(e) {
            e.preventDefault();
            if (!gameStarted) return;
            if (selectedPiece && !selectedPiece.fixed) {
                let snapped = trySnapToCorrect(selectedPiece);
                if (!snapped) {
                    trySnapToPiece(selectedPiece);
                }
                selectedPiece = null;
                draw();
            }
            isDraggingWrapper = false;
        }
        
        function onWheel(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            scale = Math.min(Math.max(0.5, scale + delta), 2);
            wrapper.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
        }
        
        function toggleMusic() {
            if (audioEnabled) {
                audio.pause();
                audioEnabled = false;
                musicToggle.innerHTML = "🔇 Включить музыку";
            } else {
                audio.play().catch(() => {});
                audioEnabled = true;
                musicToggle.innerHTML = "🔇 Выключить музыку";
            }
        }
        
        function downloadTicket() {
            window.location.href = `/download/${PUZZLE_ID}`;
        }
        
        async function startGame() {
            if (gameStarted) return;
            await initPuzzle();
            gameStarted = true;
            winShown = false;
            overlay.classList.add("hidden");
            gameDiv.classList.remove("hidden");
            musicToggle.classList.remove("hidden");
            if (audioEnabled) audio.play().catch(() => {});
        }
        
        // Навешиваем обработчики
        startBtn.onclick = startGame;
        startBtn.ontouchstart = (e) => { e.preventDefault(); startGame(); };
        
        document.getElementById('downloadTicketBtn').onclick = downloadTicket;
        musicToggle.onclick = toggleMusic;
        
        canvas.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        window.addEventListener('wheel', onWheel, { passive: false });
        
        canvas.addEventListener('touchstart', onTouchStart, { passive: false });
        canvas.addEventListener('touchmove', onTouchMove, { passive: false });
        canvas.addEventListener('touchend', onTouchEnd);
        canvas.addEventListener('touchcancel', onTouchEnd);
    })();
</script>
</body>
</html>
